<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraqueView</title><meta name="description" content="Dashboard imersivo de estatísticas de jogadores do Brasileirão — HTML, CSS e JS puros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
/* MAPA DO ARQUIVO — atualizar ao adicionar/remover seções grandes
   10-763     CSS (tokens, fundo em vídeo, filtros/menu, métricas clicáveis, avatar/brasão, componentes)
              ~417 componente CAMPO 3D · ~567 CARTA HOLOGRÁFICA · ~653 comparação + transições slide
   765-895    HTML (vídeo, topbar + filtros + Comparar, sidebars, field = carta + ranking,
              painel de comparação #compare, menu de clubes)
   898-950    dados embutidos (PLAYERS) — não ler à toa, um registro por linha
   953-fim    JS: 953 config · 1008 assets · 1047 métricas/filtros (state, METRICS, currentList)
              1097 ranking · 1130 filtros/menu · 1174 ficha · 1255 perfil · 1339 tweenPoints
              1360 campo 3D · 1464 pênaltis · 1699 carta holográfica · 1800 comparação · 1897 eventos
   Assets: assets/ (background, jogadores, clubes) — caminhos relativos, sensíveis a maiúsculas no GitHub Pages
*/

/* ---------- Tokens ---------- */
:root{
  --bg:#08130d;
  --glass:rgba(14,32,22,.42);
  --glass-2:rgba(9,24,16,.55);
  --stroke:rgba(255,255,255,.14);
  --stroke-2:rgba(255,255,255,.08);
  --ink:#ffffff;
  --ink-60:rgba(255,255,255,.62);
  --ink-40:rgba(255,255,255,.40);
  --gold:#F5CE3B;
  --gold-soft:#FFDE6B;
  --green:#38D98A;
  --red:#FF6B6B;
  --blue:#4FA3FF;
  --orange:#ffa24d;

  --gold-10:rgba(245,206,59,.10);
  --gold-18:rgba(245,206,59,.18);
  --gold-40:rgba(245,206,59,.40);
  --green-08:rgba(56,217,138,.08);
  --green-14:rgba(56,217,138,.14);
  --red-14:rgba(255,107,107,.14);
  --orange-14:rgba(255,162,77,.14);
  --white-02:rgba(255,255,255,.02);
  --white-04:rgba(255,255,255,.04);
  --heat-cold:#2f7fd6;            /* tom médio do gradiente auxiliar azul */
  --holo-1:#3a2f0a;--holo-2:#1f3a2a;--holo-3:#46370c;--holo-4:#16303f;  /* faixas escuras do brilho holográfico (color-dodge) */
  --holo-w:230px;
  --cmp-card-w:260px;
  --cmp-panel-w:430px;            /* painel de comparação: só a largura que o conteúdo pede */
  --blue-18:rgba(79,163,255,.18);--blue-40:rgba(79,163,255,.40);
  --rank-w:calc(380px * .6);      /* ranking 40% menor */
  --shade-top:rgba(8,19,13,.12);--shade-bottom:rgba(8,19,13,.34);--shade-edge:rgba(8,19,13,.48);   /* véu mais leve: vídeo mais visível */
  --glow-ink:0 0 18px rgba(245,206,59,.18),0 2px 10px rgba(0,0,0,.6);

  --font:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --display:'Sora',var(--font);
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --fs-display:38px;
  --fs-title:24px;
  --fs-body:13px;
  --fs-label:10px;
  --fs-brand:15px;

  --space:15px;
  --radius:20px;
  --radius-ctl:13px;
  --radius-sm:10px;
  --radius-pill:999px;
  --shadow:0 20px 50px -22px rgba(0,0,0,.75);
  --blur:blur(20px) saturate(1.25);
  --side:370px;
}

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  font-size:var(--fs-body);
  color:var(--ink);
  background:var(--bg);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{display:block}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-40);font-weight:600}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:var(--radius-pill)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
.app{
  height:100vh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  gap:var(--space);
  padding:var(--space);
}
.main{
  position:relative;
  display:grid;
  grid-template-columns:var(--side) minmax(0,1fr) var(--side);
  grid-template-areas:"left field right";
  gap:var(--space);
  min-height:0;
}
.side{display:flex;flex-direction:column;gap:var(--space);min-height:0;overflow-y:auto;padding-right:2px}
.side-left{grid-area:left}
.side-right{grid-area:right}
/* centro: carta + ranking soltos sobre o fundo, centralizados juntos; só o ranking se ajusta */
.field{grid-area:field;min-height:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--space)*2)}

/* ---------- Panel (componente base) ---------- */
.panel{
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);
  backdrop-filter:var(--blur);
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:var(--space);
}
.card{display:flex;flex-direction:column;gap:var(--space);flex-shrink:0}
.card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px var(--space)}
.card-title{font-size:var(--fs-title);font-weight:700;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:var(--radius-pill);
  font-size:var(--fs-label);font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  border:1px solid var(--stroke);color:var(--ink-60);background:var(--glass-2);white-space:nowrap;
}
.pill-green{color:var(--green);border-color:var(--green-14);background:var(--green-14)}
.pill-red{color:var(--red);border-color:var(--red-14);background:var(--red-14)}
.pill-orange{color:var(--orange);border-color:var(--orange-14);background:var(--orange-14)}
.pill-gold{color:var(--gold);border-color:var(--gold-18);background:var(--gold-10)}
.divider{height:1px;background:var(--stroke-2)}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;gap:var(--space);padding:10px var(--space)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;width:calc(var(--side) - var(--space) * 2)}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold-soft),var(--gold));
  display:grid;place-items:center;box-shadow:0 8px 20px -8px var(--gold-40);
}
.brand-mark svg{width:20px;height:20px;stroke:var(--bg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-family:var(--display);font-size:var(--fs-brand);font-weight:700;letter-spacing:-.01em}
.brand-name b{color:var(--gold)}
.search{
  flex:1;max-width:560px;height:40px;border-radius:var(--radius-ctl);
  background:var(--glass-2);border:1px solid var(--stroke-2);
  display:flex;align-items:center;gap:10px;padding:0 14px;transition:border-color .2s;
}
.search:focus-within{border-color:var(--gold-40)}
.search svg{width:16px;height:16px;stroke:var(--ink-40);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:var(--fs-body)}
.search input::placeholder{color:var(--ink-40)}
.topbar-meta{margin-left:auto}
.topbar{position:relative;z-index:20}
.search{min-width:160px;max-width:420px}

/* ---------- Filtros (chips cumulativos + menu de clubes) ---------- */
.filters{display:flex;align-items:center;gap:8px;flex-shrink:0}
.seg{display:flex;gap:4px;padding:3px;border-radius:var(--radius-ctl);background:var(--glass-2);border:1px solid var(--stroke-2)}
.chip{
  height:32px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;
  font-size:var(--fs-body);font-weight:600;color:var(--ink-60);white-space:nowrap;
  border:1px solid transparent;transition:background .15s,color .15s,border-color .15s;
}
.chip:hover{color:var(--ink);background:var(--white-04)}
.chip.is-on{color:var(--bg);background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
.chip:focus-visible,.metric:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
.chip-drop{height:40px;padding:0 12px;border-radius:var(--radius-ctl);background:var(--glass-2);border-color:var(--stroke-2)}
.chip-drop.is-on{color:var(--bg)}
.chip-drop svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip-drop[aria-expanded="true"] .chev{transform:rotate(180deg)}
.chip-ghost{color:var(--ink-40)}
/* "Limpar" reserva o espaço mesmo oculto: aparecer não pode deslocar os chips sob o cursor */
#filter-clear[hidden]{display:inline-flex;visibility:hidden}

/* menu suspenso de clubes: vidro translúcido, acima de tudo (fixed no body), com scroll próprio */
.club-menu{
  position:fixed;left:var(--menu-x,0);top:var(--menu-y,0);z-index:100;width:280px;
  display:flex;flex-direction:column;gap:8px;padding:12px;
  background:rgba(9,24,16,.62);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);border-radius:var(--radius-ctl);box-shadow:var(--shadow);
  animation:menu-in .16s ease;
}
.club-menu[hidden]{display:none}
@keyframes menu-in{from{opacity:0;transform:translateY(-4px)}}
.club-menu-head{display:flex;align-items:center;justify-content:space-between}
.club-list{max-height:min(380px, 60vh);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;padding-right:4px}
.club-opt{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;transition:background .15s}
.club-opt:hover{background:var(--white-04)}
.club-opt input{position:absolute;opacity:0;pointer-events:none}
.club-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ink-40);flex-shrink:0;display:grid;place-items:center;transition:all .15s}
.club-opt input:checked + .club-check{background:var(--gold);border-color:var(--gold)}
.club-opt input:checked + .club-check::after{content:"";width:8px;height:4px;border:2px solid var(--bg);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.club-opt input:focus-visible + .club-check{outline:2px solid var(--gold-soft);outline-offset:2px}
.club-opt-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club-opt-count{color:var(--ink-40);font-size:var(--fs-label)}

/* ---------- Métricas clicáveis (reordenam o ranking) ---------- */
.metric{cursor:pointer;transition:background .18s,box-shadow .18s,color .18s}
.tile.metric:hover,.gauge.metric:hover,.rating-hero.metric:hover,.info-row.metric:hover{background:var(--gold-10);box-shadow:0 0 0 1px var(--gold-18),0 6px 18px -10px var(--gold-40)}
.tile.metric.is-metric,.gauge.metric.is-metric,.info-row.metric.is-metric{background:var(--gold-10);box-shadow:0 0 0 1px var(--gold-40)}
.rating-hero.metric.is-metric{box-shadow:0 0 0 1px var(--gold-40)}
.info-row.metric{border-radius:var(--radius-sm);padding:4px 6px;margin:-4px -6px}
.metric-inline{border-radius:6px;padding:1px 4px;margin:0 -2px}
.metric-inline:hover{background:var(--gold-10);color:var(--gold-soft)}
.metric-inline.is-metric{color:var(--gold);background:var(--gold-10)}
.radar-hit{fill:transparent}
.radar-axis:hover .radar-hit{fill:var(--gold-10)}
.radar-axis:hover .radar-label,.radar-axis.is-metric .radar-label{fill:var(--gold-soft)}
.radar-axis.is-metric .radar-value{fill:var(--gold)}
.radar-axis:focus{outline:none}
.radar-axis:focus-visible .radar-hit{stroke:var(--gold-soft);stroke-width:1.5}

/* ---------- Fundo: vídeo do estádio em loop ---------- */
/* cover mantém a proporção do vídeo (sem distorcer) e preenche a tela com gramado e arquibancadas */
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;z-index:-2;pointer-events:none}
/* véu escuro por cima do vídeo para manter o contraste do texto e o "dark" do sistema */
.bg-shade{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 45% at 50% -8%, var(--gold-10), transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 50%, transparent 40%, var(--shade-edge) 100%),
    linear-gradient(180deg, var(--shade-top), var(--shade-bottom));
}

/* ---------- Avatar (componente reaproveitado, circular, com foto do jogador) ---------- */
.avatar{
  position:relative;overflow:hidden;border-radius:50%;
  display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(135deg,var(--c1,var(--glass-2)),var(--c2,var(--glass)));
  border:1px solid var(--stroke);
  font-family:var(--display);font-weight:700;color:var(--ink);
  text-shadow:0 1px 3px rgba(0,0,0,.55);
}
.avatar-sm{width:34px;height:34px;font-size:var(--fs-label)}
.avatar-md{width:56px;height:56px;font-size:var(--fs-body)}
.avatar-lg{width:64px;height:64px;font-size:var(--fs-title)}
.avatar-xl{width:76px;height:76px;font-size:var(--fs-title)}
.avatar-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}

/* ---------- Brasão do clube (componente) ---------- */
.crest{flex-shrink:0;object-fit:contain;filter:drop-shadow(0 0 1px var(--ink-60)) drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.crest-sm{width:22px;height:22px}
.crest-md{width:40px;height:40px}
.crest-fallback.crest-sm{width:22px;height:22px;font-size:var(--fs-label)}
.crest-fallback.crest-md{width:40px;height:40px;font-size:var(--fs-label)}
.club-line{display:inline-flex;align-items:center;gap:8px}

/* ---------- Ranking (field) ---------- */
/* 40% menor que a versão anterior (380px de largura × altura total do field) */
.ranking{flex:0 0 var(--rank-w);width:var(--rank-w);height:60%;align-self:center;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.ranking .card-title{white-space:normal}
.ranking .rank-row{gap:10px;padding:6px 8px}
.podium .avatar-xl{width:46px;height:46px;font-size:var(--fs-body)}
.podium .avatar-md{width:34px;height:34px;font-size:var(--fs-label)}
.ranking .podium{gap:6px;padding:6px 0 0}
.ranking .podium-name{font-size:var(--fs-label)}
.ranking .podium-club{display:none}
.ranking .podium-rating{font-size:var(--fs-body)}
.ranking .p1 .podium-rating{font-size:var(--fs-title)}
/* efeito "projetado": brilho no texto e a lista some suavemente nas bordas */
.podium-name,.podium-rating,.podium-place{text-shadow:var(--glow-ink)}
.ranking .rank-list{-webkit-mask-image:linear-gradient(180deg,transparent,#000 14px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(180deg,transparent,#000 14px,#000 calc(100% - 40px),transparent);padding-top:6px;padding-bottom:30px}
/* pódio solto: sem fundo, sem holofote e sem pedestais — a hierarquia vem só da altura e do tamanho */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:var(--space);padding:var(--space) var(--space) 0}
.podium[hidden]{display:none}
.podium-slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;border-radius:var(--radius-ctl);transition:transform .2s}
.podium-slot:hover{transform:translateY(-3px)}
.podium-slot .podium-name{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-slot .podium-club{color:var(--ink-60);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-rating{font-size:var(--fs-title);font-weight:700;color:var(--ink)}
.p1 .podium-rating{color:var(--gold)}
.p1 .avatar{box-shadow:0 0 0 2px var(--gold),0 12px 30px -10px var(--gold-40)}
.p1 .podium-name{font-size:var(--fs-body)}
.crown{width:22px;height:22px;stroke:var(--gold);fill:var(--gold-18);stroke-width:1.6;stroke-linejoin:round}
.podium-place{font-family:var(--display);font-size:var(--fs-body);font-weight:700;color:var(--ink-40)}
.p1 .podium-place{color:var(--gold)}
.p1{padding-bottom:30px}
.p2{padding-bottom:14px}
.podium-slot.is-active .avatar{outline:2px solid var(--gold-soft);outline-offset:3px}

.list-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.rank-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.rank-row{
  display:flex;align-items:center;gap:var(--space);
  padding:8px 12px;border-radius:var(--radius-ctl);
  border:1px solid transparent;background:var(--white-02);transition:background .15s,border-color .15s;
}
.rank-row:hover{background:var(--glass-2);border-color:var(--stroke-2)}
.rank-row.is-active{border-color:var(--gold-40);background:var(--gold-10)}
.rank-num{width:22px;color:var(--ink-40);font-weight:600}
.rank-row.is-active .rank-num{color:var(--gold)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{color:var(--ink-40);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-metric{font-weight:700}
.rank-row.is-active .row-metric{color:var(--gold)}
.empty{color:var(--ink-40);text-align:center;padding:var(--space)}

/* ---------- Ficha técnica ---------- */
.bio-head{display:flex;align-items:center;gap:var(--space)}
.bio-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bio-name{font-size:var(--fs-title);font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bio-sub{color:var(--ink-60)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{
  background:var(--glass-2);border:1px solid var(--stroke-2);border-radius:var(--radius-ctl);
  padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;
}
.tile-value{font-size:var(--fs-body);font-weight:700}
.tile-value small{font-size:var(--fs-label);color:var(--ink-40);font-weight:500;margin-left:2px}
.info-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space)}
.info-row > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.info-strong{font-weight:600}
.market-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space)}
.market-value{font-size:var(--fs-title);font-weight:700}
.market-value small{font-size:var(--fs-body);color:var(--ink-60);font-weight:500}
.delta{font-weight:600}
.delta-up{color:var(--green)}
.delta-down{color:var(--red)}
.delta-flat{color:var(--ink-60)}
.bio-phys{color:var(--ink-40)}
.market{
  display:flex;flex-direction:column;gap:10px;padding:var(--space);
  border-radius:var(--radius-ctl);background:var(--glass-2);border:1px solid var(--gold-18);
}
/* gráfico de linha com eixos (componente reaproveitável) */
.chart{width:100%;height:auto;overflow:visible}
.chart-grid{stroke:var(--stroke-2);stroke-width:1}
.chart-axis{stroke:var(--stroke);stroke-width:1}
.chart-tick{fill:var(--ink-40);font-family:var(--mono);font-size:var(--fs-label)}
.chart-title{fill:var(--ink-60);font-family:var(--display);font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.12em}
.chart-val{fill:var(--ink-60);font-family:var(--mono);font-size:var(--fs-label);font-weight:600}
.chart-val.last{fill:var(--gold)}
.chart-line{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-dot{fill:var(--bg);stroke:var(--gold);stroke-width:2}
.chart-dot.last{fill:var(--gold)}
.chart-stop-a{stop-color:var(--gold);stop-opacity:.26}
.chart-stop-b{stop-color:var(--gold);stop-opacity:0}
.market-foot{color:var(--ink-60)}

/* radar de atributos */
.radar{width:100%;height:auto}
.radar-ring{fill:none;stroke:var(--stroke-2);stroke-width:1}
.radar-ring.outer{stroke:var(--stroke)}
.radar-spoke{stroke:var(--stroke-2);stroke-width:1}
.radar-area{fill:var(--gold-18);stroke:var(--gold);stroke-width:2;stroke-linejoin:round}
.radar-dot{fill:var(--gold);stroke:var(--bg);stroke-width:1.5}
.radar-label{fill:var(--ink-60);font-family:var(--display);font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.06em}
.radar-value{fill:var(--ink);font-family:var(--mono);font-size:var(--fs-body);font-weight:700}
.radar-note{color:var(--ink-40);text-align:center;font-size:var(--fs-label)}

/* grupo de métricas + medidor de precisão */
/* duas colunas compactas (chute | passe): totais, certos/no alvo e o medidor logo abaixo */
.stat-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-col{display:flex;flex-direction:column;gap:6px}
.stat-col .tile{padding:7px 10px;flex-direction:row;align-items:baseline;justify-content:space-between}
.gauge{
  background:var(--glass-2);border:1px solid var(--stroke-2);border-radius:var(--radius-ctl);
  padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;
}
.gauge svg{width:100%;max-width:92px;height:auto;margin-top:4px}
.gauge-track{fill:none;stroke-width:10;stroke-opacity:.22}
.gauge-arc{fill:none;stroke-width:10;stroke-linecap:round}
.gauge-needle{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.gauge-hub{fill:var(--ink)}
.gauge-value{font-size:var(--fs-title);font-weight:700;line-height:1}
.band-low{stroke:var(--red);color:var(--red)}
.band-mid{stroke:var(--gold);color:var(--gold)}
.band-high{stroke:var(--green);color:var(--green)}
.gauge-note{color:var(--ink-40);font-size:var(--fs-label)}

/* scroll interno dos cards da sidebar direita */
.side-right{overflow:hidden}
.side-right > .panel{flex:1 1 0;min-height:0}
.card-body{flex:1;min-height:0;overflow-y:auto;padding-right:6px;margin-right:-6px}

/* ---------- Perfil de desempenho ---------- */
.rating-hero{
  display:flex;align-items:center;gap:var(--space);
  padding:var(--space);border-radius:var(--radius-ctl);
  background:linear-gradient(135deg,var(--gold-10),transparent);border:1px solid var(--gold-18);
}
.rating-big{font-size:var(--fs-display);font-weight:700;color:var(--gold);line-height:1}
.rating-meta{flex:1;display:flex;flex-direction:column;gap:6px}
/* barra de progresso (componente reaproveitado: rating, precisões, terços) */
.bar{width:100%;height:6px;border-radius:var(--radius-pill);overflow:hidden}
.bar-track{fill:var(--white-04)}
.bar-fill{fill:var(--gold)}
.bar-green .bar-fill{fill:var(--green)}
.bar-blue .bar-fill{fill:var(--blue)}
.bar-thin{height:4px}
.acc{display:flex;flex-direction:column;gap:8px}
.acc-row{display:flex;justify-content:space-between;align-items:baseline}

/* ---------- Mapa de presença (palco do campo 3D) ---------- */
/* o palco mantém a mesma caixa do heatmap 2D anterior (105:68): o card não muda de tamanho */
.heat-stage{width:100%;aspect-ratio:105/68;container-type:size;display:grid;place-items:center}
.pitch-dir{display:flex;justify-content:space-between;color:var(--ink-40);font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.12em}
.heat-legend{display:flex;align-items:center;gap:10px;color:var(--ink-40);font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.1em}
.heat-scale{flex:1;height:6px;border-radius:var(--radius-pill);background:linear-gradient(90deg,var(--heat-cold),var(--green),var(--gold),var(--red))}
.thirds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ===========================================================================
   CAMPO 3D — componente autocontido (origem: elementos/campo3d_card.html).
   Bloco de terra flutuante com heatmap na superfície, 100% CSS.
   --w é deduzido do palco (container query) para ocupar o espaço disponível.
   As cores internas de solo/grama são do próprio componente (autocontido).
   =========================================================================== */
.campo3d{
  --w:min(calc(100cqw / 1.81), calc(100cqh / 1.31));
  --h:calc(var(--w)*1.545);
  --m:calc(var(--w)*0.085);
  --bw:calc(var(--w) + var(--m)*2);
  --bh:calc(var(--h) + var(--m)*2);
  --d:calc(var(--w)*0.0575);
  --gol-esc:1.85;
  --wgol:calc(var(--w)*0.108*var(--gol-esc));
  --hgol:calc(var(--w)*0.036*var(--gol-esc));
  --faixa:calc(var(--w)/8);
  --rz:26deg;
  --rx:58deg;
  --lw:max(1px, calc(var(--w)*0.0085));
  --linha:rgba(255,255,255,.66);
  --borrao:calc(var(--w)*0.052);
  position:relative;
  width:calc(var(--bw)*cos(var(--rz)) + var(--bh)*sin(var(--rz)));
  height:calc((var(--bw)*sin(var(--rz)) + var(--bh)*cos(var(--rz)))*cos(var(--rx))
              + var(--d)*sin(var(--rx)) + var(--hgol)*sin(var(--rx)) + var(--w)*0.11);
  perspective:calc(var(--w)*7); perspective-origin:50% 40%;
}
.c3-sombra{ position:absolute; left:50%; top:58%; width:76%; height:46%;
  transform:translate(-50%,-50%); border-radius:50%; filter:blur(calc(var(--w)*0.06));
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.62), rgba(0,0,0,.30) 46%, transparent 72%); }
.c3-flutua{ position:absolute; left:50%; top:50%; width:var(--bw); height:var(--bh);
  transform-style:preserve-3d;
  --sobe:calc(var(--d)*sin(var(--rx))*-0.5 - var(--w)*0.055);
  transform:translate(-50%,-50%) translateY(var(--sobe));
  animation:c3-bob 7.5s ease-in-out infinite; }
@keyframes c3-bob{ 50%{ transform:translate(-50%,-50%) translateY(calc(var(--sobe) - 5px)) } }
.c3-cena{ position:absolute; inset:0; transform-style:preserve-3d;
  transform:rotateX(var(--rx)) rotateZ(calc(-1*var(--rz))); }
.c3-topo{ position:absolute; inset:0; overflow:hidden; border-radius:calc(var(--w)*0.02);
  background:
    linear-gradient(115deg, rgba(255,255,255,.11), rgba(255,255,255,0) 42%, rgba(0,0,0,.24)),
    repeating-linear-gradient(99deg, rgba(255,255,255,.06) 0 1px, rgba(0,0,0,.055) 1px 2.2px, transparent 2.2px 4.5px),
    repeating-radial-gradient(circle at 30% 35%, rgba(255,255,255,.055) 0 1.1px, transparent 1.9px),
    repeating-radial-gradient(circle at 68% 66%, rgba(0,0,0,.14) 0 1.2px, transparent 2.1px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.20) 0 1px, transparent 1px var(--faixa)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.075) 0, rgba(255,255,255,0) calc(var(--faixa)*.55),
      rgba(0,0,0,.10) var(--faixa), rgba(0,0,0,0) calc(var(--faixa)*1.55),
      rgba(255,255,255,.075) calc(var(--faixa)*2)),
    repeating-linear-gradient(90deg, #26603a 0 var(--faixa), #1f5330 var(--faixa) calc(var(--faixa)*2));
  background-size:auto, auto, 9px 7px, 13px 11px, auto, auto, auto;
  box-shadow:inset 0 0 calc(var(--w)*0.12) rgba(0,0,0,.35); }
/* calor e brilho em SVG (atributos, sem estilo inline); o blur funde as células */
.c3-pista{ position:absolute; inset:var(--m) }
.c3-calor,.c3-brilho{ position:absolute; inset:0; width:100%; height:100% }
.c3-calor{ filter:blur(var(--borrao)) }
.c3-brilho{ mix-blend-mode:screen; filter:blur(calc(var(--w)*0.09)) }
.c3-topo.trocando .c3-calor,.c3-topo.trocando .c3-brilho{ animation:c3-entra .45s ease both }
@keyframes c3-entra{ from{ opacity:0 } to{ opacity:1 } }
.c3-linhas{ position:absolute; inset:var(--m); overflow:hidden }
.c3-linhas i{ position:absolute; border:var(--lw) solid var(--linha) }
.c3-linhas .borda{ inset:0 }
.c3-linhas .meio{ left:0; right:0; top:50%; border-width:var(--lw) 0 0 }
.c3-linhas .circulo{ left:50%; top:50%; width:26.9%; aspect-ratio:1; border-radius:50%; transform:translate(-50%,-50%) }
.c3-linhas .area{ left:20.35%; width:59.3%; height:15.7% }
.c3-linhas .pequena{ left:36.55%; width:26.9%; height:5.24% }
.c3-linhas .n{ top:0 } .c3-linhas .s{ bottom:0 }
.c3-linhas .canto{ width:4%; aspect-ratio:1; border-radius:50% }
.c3-linhas .canto.no{ left:-2%; top:-2%} .c3-linhas .canto.ne{ right:-2%; top:-2%}
.c3-linhas .canto.so{ left:-2%; bottom:-2%} .c3-linhas .canto.se{ right:-2%; bottom:-2%}
.c3-linhas .ponto{ width:1.7%; aspect-ratio:1; border:0; border-radius:50%; background:var(--linha); left:50%; transform:translate(-50%,-50%) }
.c3-linhas .ponto.centro{ top:50% } .c3-linhas .ponto.pn{ top:10.5% } .c3-linhas .ponto.ps{ top:89.5% }
.c3-gol{ position:absolute; left:calc(var(--m) + var(--w)*0.5 - var(--wgol)*0.5); width:var(--wgol);
  height:var(--hgol); transform-origin:0 100%; transform:rotateX(-90deg);
  border:var(--lw) solid rgba(255,255,255,.88); border-bottom:0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.32) 0 .7px, transparent .7px 3.2px),
    repeating-linear-gradient(0deg,  rgba(255,255,255,.24) 0 .7px, transparent .7px 3.2px),
    rgba(255,255,255,.05); }
.c3-gol.n{ top:calc(var(--m) - var(--hgol)) }
.c3-gol.s{ top:calc(var(--m) + var(--h) - var(--hgol)) }
.c3-sombra-gol{ position:absolute; left:calc(var(--m) + var(--w)*0.5 - var(--wgol)*0.5); width:var(--wgol);
  height:calc(var(--hgol)*1.33); transform-origin:0 0; transform:skewX(34deg);
  mix-blend-mode:multiply; filter:blur(.7px);
  background:linear-gradient(180deg, rgba(0,0,0,.52), rgba(0,0,0,.44) 35%, rgba(0,0,0,.10)); }
.c3-sombra-gol.n{ top:var(--m) }
.c3-sombra-gol.s{ top:calc(var(--m) + var(--h)) }
.c3-lado{ position:absolute; --ang:180deg; background:
    repeating-radial-gradient(circle at 21% 34%, rgba(255,255,255,.09) 0 1px, transparent 1.7px),
    repeating-radial-gradient(circle at 68% 71%, rgba(0,0,0,.34) 0 1.3px, transparent 2.2px),
    linear-gradient(var(--ang),
      #3f7f4b 0 1.6px, #2c5b35 1.6px 2.8px, #6d4c2c 2.8px 40%,
      #57391f 40% 62%, #3d2716 62% 82%, #2a1a0e 82% 100%);
  background-size:8px 7px, 11px 6px, auto; }
.c3-lado.s{ left:0; top:100%; width:var(--bw); height:var(--d);
  transform-origin:0 0; transform:rotateX(-90deg); filter:brightness(.78);
  clip-path:polygon(0 0, 100% 0, 100% 78%, 96.5% 96%, 93% 70%, 89% 90%, 85.5% 66%, 82% 94%,
    78% 74%, 74.5% 88%, 71% 64%, 67% 92%, 63.5% 72%, 60% 96%, 56% 68%, 52.5% 86%, 49% 62%,
    45% 90%, 41.5% 74%, 38% 94%, 34% 66%, 30.5% 88%, 27% 70%, 23% 96%, 19.5% 72%, 16% 84%,
    12% 64%, 8.5% 92%, 5% 70%, 0 86%); }
.c3-lado.o{ left:0; top:0; width:var(--d); height:var(--bh); --ang:90deg;
  transform-origin:0 0; transform:rotateY(90deg);
  clip-path:polygon(0 0, 84% 0, 66% 3.5%, 92% 7%, 70% 10.5%, 96% 14%, 64% 17.5%, 88% 21%,
    72% 24.5%, 94% 28%, 62% 31.5%, 90% 35%, 68% 38.5%, 86% 42%, 74% 45.5%, 98% 49%, 66% 52.5%,
    92% 56%, 70% 59.5%, 84% 63%, 60% 66.5%, 94% 70%, 72% 73.5%, 88% 77%, 64% 80.5%, 96% 84%,
    68% 87.5%, 90% 91%, 74% 94.5%, 86% 100%, 0 100%); }
.c3-poeira{ position:absolute; inset:0; pointer-events:none }
.c3-poeira i{ position:absolute; width:2px; height:2px; border-radius:50%; opacity:0;
  background:#5d4127; animation:c3-cai 3.4s linear infinite }
@keyframes c3-cai{
  0%  { opacity:0;   transform:translate(0,-3px) scale(1) }
  14% { opacity:.9 }
  65% { opacity:.45 }
  100%{ opacity:0;   transform:translate(3px,15px) scale(.55) }
}
.c3-poeira i:nth-child(1){ left:8%;  top:36%; animation-delay:-.2s; animation-duration:3.1s }
.c3-poeira i:nth-child(2){ left:15%; top:49%; animation-delay:-1.7s; width:1.5px; height:1.5px }
.c3-poeira i:nth-child(3){ left:23%; top:63%; animation-delay:-.9s; animation-duration:4.1s }
.c3-poeira i:nth-child(4){ left:31%; top:78%; animation-delay:-2.6s; width:2.5px; height:2.5px }
.c3-poeira i:nth-child(5){ left:42%; top:94%; animation-delay:-.5s; animation-duration:3.7s }
.c3-poeira i:nth-child(6){ left:53%; top:90%; animation-delay:-2.1s; width:1.5px; height:1.5px }
.c3-poeira i:nth-child(7){ left:64%; top:85%; animation-delay:-1.2s; animation-duration:4.4s }
.c3-poeira i:nth-child(8){ left:76%; top:80%; animation-delay:-3.0s; width:2.5px; height:2.5px }
.c3-poeira i:nth-child(9){ left:88%; top:76%; animation-delay:-1.5s; animation-duration:3.3s }
@media (prefers-reduced-motion:reduce){ .c3-flutua{ animation:none } .c3-poeira{ display:none } }

/* ---------- Pênaltis (goleira 3D em canvas + marcadores em SVG por cima) ---------- */
/* mesma caixa da ilustração 2D anterior (320:150) */
.goal-stage{position:relative;width:100%;aspect-ratio:320/150;border-radius:var(--radius-ctl);overflow:hidden}
.goal-canvas{display:block;width:100%;height:100%}
.goal-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.goal-overlay circle{pointer-events:auto}
.goal-zone{fill:none;stroke:var(--ink-40);stroke-width:1;stroke-dasharray:3 4}
.goal-zone-fill{fill:var(--gold)}
.kick-goal{fill:var(--green);stroke:var(--bg);stroke-width:2}
.kick-saved{fill:var(--red);stroke:var(--bg);stroke-width:2}
.kick-saved-x{stroke:var(--bg);stroke-width:2;stroke-linecap:round}
.kick-out{fill:var(--orange-14);stroke:var(--orange);stroke-width:2;stroke-dasharray:3 2}
.pen-tiles .tile-value{font-size:var(--fs-title)}
.tile-value.green{color:var(--green)}
.tile-value.red{color:var(--red)}
.tile-note{color:var(--ink-40);font-size:var(--fs-label)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space);color:var(--ink-60)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%}
.dot-goal{background:var(--green)}
.dot-saved{background:var(--red)}
.dot-out{border:2px dashed var(--orange)}
.pen-empty{color:var(--ink-40);text-align:center}

/* ===========================================================================
   CARTA HOLOGRÁFICA — origem: elementos/carta_holografica.html
   Mecanismo 3D/luz adaptado de "Pokémon Cards CSS" (Simon Goellner, MIT).
   Estrutura: .holo-slot (vertical swap) > .holo-float (flutua) > .holo-card (rotaciona).
   Cor da carta = clube do jogador (--c1/--c2); filete = faixa de rating (tier).
   =========================================================================== */
.holo-stage{flex:0 0 var(--holo-w);width:var(--holo-w);perspective:600px;align-self:center}
.holo-slot{will-change:transform}
.holo-float{display:grid;transform-style:preserve-3d;will-change:transform}
@media (prefers-reduced-motion:no-preference){ .holo-float{animation:holo-bob 5s ease-in-out infinite} }
@keyframes holo-bob{0%,100%{transform:translate3d(0,0,.01px)}50%{transform:translate3d(0,-8px,.01px)}}
.holo-float.interacting{animation-play-state:paused}
.holo-card{
  --pointer-x:50%;--pointer-y:50%;--pointer-from-center:0;--card-opacity:0;
  --rotate-x:0deg;--rotate-y:0deg;--background-x:50%;--background-y:50%;
  --cut:polygon(9% 0,100% 0,100% 92%,91% 100%,0 100%,0 8%);
  position:relative;width:100%;aspect-ratio:300/430;border-radius:var(--radius);
  clip-path:var(--cut);
  background:
    radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--c1) 55%, transparent), transparent 70%),
    linear-gradient(155deg, color-mix(in srgb, var(--c1) 38%, var(--bg)) 0%, color-mix(in srgb, var(--c2) 30%, var(--bg)) 55%, var(--bg) 100%);
  box-shadow:0 30px 60px -24px rgba(0,0,0,.75);
  transform-style:preserve-3d;
  transform:rotateY(var(--rotate-x)) rotateX(var(--rotate-y));
  will-change:transform;cursor:pointer;
}
.holo-card::before{
  content:'';position:absolute;inset:0;clip-path:var(--cut);padding:1.5px;z-index:7;pointer-events:none;
  background:var(--tier-edge);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.tier-gold{--tier-edge:linear-gradient(155deg,var(--gold-soft),var(--gold) 40%,var(--gold-40) 70%,var(--gold) 100%);--tier-ink:var(--gold-soft)}
.tier-green{--tier-edge:linear-gradient(155deg,var(--green),var(--green-14) 70%,var(--green) 100%);--tier-ink:var(--green)}
.tier-silver{--tier-edge:linear-gradient(155deg,var(--ink),var(--ink-40) 70%,var(--ink-60) 100%);--tier-ink:var(--ink)}
.holo-foil,.holo-shine,.holo-glare,.holo-edge{position:absolute;inset:0;clip-path:var(--cut);pointer-events:none}
.holo-foil{
  z-index:3;
  background:repeating-linear-gradient(115deg, transparent 0 8%, var(--gold-18) 9% 11%, var(--green-14) 12% 14%, transparent 15% 24%);
  background-size:220% 220%;
  background-position:calc(((50% - var(--background-x)) * 2.6) + 50%) calc(((50% - var(--background-y)) * 3.5) + 50%);
  opacity:calc(.5 + var(--pointer-from-center) * .5);
  mix-blend-mode:soft-light;transform:translateZ(1px);
}
.holo-shine{
  z-index:4;--scan:2px;
  background-image:
    repeating-linear-gradient(110deg, var(--holo-1), var(--holo-2), var(--holo-3), var(--holo-4), var(--holo-1), var(--holo-2), var(--holo-3), var(--holo-4), var(--holo-1)),
    repeating-linear-gradient(90deg, #000 0, #000 calc(var(--scan)*2), #555 calc(var(--scan)*2), #555 calc(var(--scan)*4));
  background-position:calc(((50% - var(--background-x)) * 3.2) + 50%) calc(((50% - var(--background-y)) * 4) + 50%), center center;
  background-size:340% 340%, cover;background-blend-mode:overlay;
  filter:brightness(.9) contrast(2.2) saturate(1.1);mix-blend-mode:color-dodge;
  opacity:calc(var(--card-opacity) * .55);transform:translateZ(1.2px);
}
.holo-glare{
  z-index:5;
  background-image:radial-gradient(farthest-corner circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,.7) 10%, rgba(255,255,255,.5) 20%, rgba(0,0,0,.5) 90%);
  opacity:var(--card-opacity);mix-blend-mode:overlay;transform:translateZ(1.41px);
}
.holo-edge{z-index:6;box-shadow:0 1px 0 var(--stroke) inset}
.holo-inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;transform:translateZ(28px)}
.holo-top{display:flex;justify-content:space-between;align-items:flex-start;padding:var(--space) var(--space) 0}
.holo-ovr{display:flex;flex-direction:column;align-items:center;line-height:1;gap:4px}
.holo-ovr b{font-family:var(--display);font-size:var(--fs-display);font-weight:700;color:var(--tier-ink);letter-spacing:-.02em}
.holo-ovr span{font-size:var(--fs-label);font-weight:700;letter-spacing:.1em;color:var(--ink-60)}
.holo-ovr i{font-style:normal;font-size:var(--fs-body)}
.holo-portrait{position:relative;flex:1;display:grid;place-items:center;min-height:0}
.holo-glow{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--gold-40),transparent 70%);filter:blur(10px)}
.holo-portrait .avatar{position:relative;width:46%;height:auto;aspect-ratio:1;font-size:var(--fs-display);border-color:var(--stroke)}
/* foto recortada do jogador (card_*.png) no lugar do número; se falhar, o avatar reaparece */
.holo-portrait{overflow:hidden}
/* silhueta em destaque: maior que o retrato, sobe por trás do OVR/brasão (o recorte da carta limita) */
.holo-portrait{overflow:visible}
.holo-top{position:relative;z-index:2}
.holo-name,.holo-stats{position:relative;z-index:2}
.holo-photo{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);height:150%;width:auto;max-width:none;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6));z-index:1}
.holo-glow{width:95%}
.holo-portrait:has(.holo-photo) .avatar{display:none}
.holo-name{text-align:center;padding:8px 10px 6px;background:linear-gradient(180deg,var(--gold-10),transparent);display:flex;flex-direction:column;gap:2px}
.holo-name b{font-size:var(--fs-body);font-weight:800;letter-spacing:.06em;color:var(--tier-ink);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.holo-name span{font-size:var(--fs-label);color:var(--ink-40)}
.holo-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 2px;padding:6px 10px var(--space)}
.holo-stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.holo-stat b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:var(--fs-body);font-weight:700}
.holo-stat span{font-size:var(--fs-label);letter-spacing:.08em;color:var(--ink-40);font-weight:700}

/* ---------- Responsivo ---------- */
/* ---------- Comparação ---------- */
.compare-btn{color:var(--ink)}
.compare-btn[aria-pressed="true"]{color:var(--bg);background:linear-gradient(135deg,var(--gold-soft),var(--gold));border-color:transparent}

/* modo de escolha: o ranking pede o 2º jogador */
.pick-hint{
  padding:8px 10px;border-radius:var(--radius-sm);text-align:center;color:var(--ink);
  background:var(--blue-18);border:1px solid var(--blue-40);animation:pick-pulse 1.6s ease-in-out infinite;
}
.pick-hint b{color:var(--blue)}
.pick-hint[hidden]{display:none}
@keyframes pick-pulse{50%{box-shadow:0 0 0 4px var(--blue-18)}}
.is-picking .rank-row:hover,.is-picking .podium-slot:hover .avatar{border-color:var(--blue-40);box-shadow:0 0 0 2px var(--blue)}
.is-picking .rank-row:hover{background:var(--blue-18)}
.is-picking .rank-row.is-active,.is-picking .podium-slot.is-active{opacity:.4;cursor:not-allowed}

/* modo comparação: os cards do dash somem, fica só o fundo; a topbar vira só o botão */
/* TRANSIÇÕES EM SLIDE — nada aparece/some instantaneamente:
   entrar: sidebars saem pelas laterais e o centro desce (0s) → carta A e painel entram (.3s) → carta B sobe (.55s)
   sair:   carta A, painel e carta B saem (0s) → sidebars e centro voltam deslizando (.3s) */
:root{--slide:.6s cubic-bezier(.7,0,.3,1)}
.side-left,.side-right,.field{transition:transform var(--slide) .3s}
.is-comparing .side-left,.is-comparing .side-right,.is-comparing .field{transition-delay:0s;pointer-events:none}
.is-comparing .side-left{transform:translateX(calc(-100% - 80px))}
.is-comparing .side-right{transform:translateX(calc(100% + 80px))}
.is-comparing .field{transform:translateY(100vh)}
.topbar > *,.topbar{transition:opacity .35s ease,visibility .35s,background .35s,border-color .35s,box-shadow .35s}
.is-comparing .topbar{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.is-comparing .topbar > :not(.compare-btn){opacity:0;visibility:hidden;pointer-events:none}

.compare{
  position:absolute;inset:0;z-index:5;
  display:grid;grid-template-columns:var(--cmp-card-w) var(--cmp-panel-w) var(--cmp-card-w);
  justify-content:center;align-items:center;gap:calc(var(--space)*2);
  visibility:hidden;pointer-events:none;transition:visibility 0s linear .65s;   /* some só depois de as peças saírem */
}
.is-comparing .compare{visibility:visible;pointer-events:auto;transition-delay:0s}
.cmp-stage-a,.cmp-panel,.cmp-stage-b{transition:transform var(--slide) 0s}
.cmp-stage-a{transform:translateX(-100vw)}
.cmp-panel{transform:translateY(100vh)}
.cmp-stage-b{transform:translateY(100vh)}
.is-comparing .cmp-stage-a,.is-comparing .cmp-panel{transform:none;transition-delay:.3s}
.is-comparing .cmp-stage-b{transform:none;transition-delay:.55s}   /* 2ª carta: slide up */
@media (prefers-reduced-motion:reduce){
  .side-left,.side-right,.field,.cmp-stage-a,.cmp-panel,.cmp-stage-b{transition-duration:0s;transition-delay:0s}
}
.cmp-stage{flex:none;width:var(--cmp-card-w);display:flex;flex-direction:column;align-items:center;gap:var(--space)}
.cmp-stage .holo-slot{width:100%}
.cmp-tag{font-size:var(--fs-label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-pill)}
.cmp-tag-a{color:var(--gold);background:var(--gold-10);border:1px solid var(--gold-18)}
.cmp-tag-b{color:var(--blue);background:var(--blue-18);border:1px solid var(--blue-40)}
.cmp-panel{max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:var(--space)}
.cmp-panel > *{flex-shrink:0}   /* o painel rola; nenhum bloco (radar incluso) pode ser esmagado */
.cmp-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--space)}
.cmp-who{display:flex;align-items:center;gap:10px;min-width:0}
.cmp-who div{display:flex;flex-direction:column;gap:2px;min-width:0}
.cmp-who b{font-size:var(--fs-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-who span{font-size:var(--fs-label);color:var(--ink-40)}
.cmp-who-a b{color:var(--gold)}
.cmp-who-b{justify-content:flex-end;text-align:right}
.cmp-who-b b{color:var(--blue)}
.cmp-vs{font-family:var(--display);font-size:var(--fs-title);font-weight:700;color:var(--ink-40)}
.cmp-score{display:flex;align-items:center;justify-content:center;gap:var(--space)}
.cmp-score-a,.cmp-score-b{font-size:var(--fs-title);font-weight:700}
.cmp-score-a{color:var(--gold)} .cmp-score-b{color:var(--blue)}
.cmp-radar{width:100%;max-height:300px;height:auto}
.cmp-area-a{fill:var(--gold-18);stroke:var(--gold);stroke-width:2;stroke-linejoin:round}
.cmp-area-b{fill:var(--blue-18);stroke:var(--blue);stroke-width:2;stroke-linejoin:round}
.cmp-dot-a{fill:var(--gold);stroke:var(--bg);stroke-width:1.5}
.cmp-dot-b{fill:var(--blue);stroke:var(--bg);stroke-width:1.5}
.cmp-t-a{fill:var(--gold)} .cmp-t-b{fill:var(--blue)} .cmp-t-sep{fill:var(--ink-40)}
.cmp-t-a:not(.win),.cmp-t-b:not(.win){fill-opacity:.55}
.cmp-list{display:flex;flex-direction:column;gap:6px}
.cmp-row{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;gap:var(--space);padding:8px 12px;border-radius:var(--radius-ctl);background:var(--white-02);border:1px solid var(--stroke-2)}
.cmp-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.cmp-val{font-weight:700;color:var(--ink-60);display:flex;align-items:center;gap:6px}
.cmp-val-a{justify-content:flex-start}
.cmp-val-b{justify-content:flex-end}
.cmp-val-a.win{color:var(--gold)}
.cmp-val-b.win{color:var(--blue)}
.cmp-up{font-style:normal;font-size:var(--fs-label)}
.duel{width:100%;height:6px;border-radius:var(--radius-pill);overflow:hidden}
.duel-track{fill:var(--white-04)}
.duel-a{fill:var(--gold)}
.duel-b{fill:var(--blue)}

@media (max-width:1200px){
  body{overflow-y:auto;overflow-x:hidden}   /* cards fora da tela durante o slide não criam scroll lateral */
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr 1fr;grid-template-areas:"field field" "left right"}
  .field{height:78vh}
  .side,.side-right,.card-body{overflow:visible}
  .side-right > .panel{flex:none}
  /* comparação em telas estreitas: as duas cartas lado a lado, painel embaixo */
  .compare{position:fixed;top:84px;bottom:var(--space);left:var(--space);right:var(--space);
    grid-template-columns:repeat(2,minmax(0,var(--cmp-card-w)));align-content:start;align-items:start;overflow-y:auto}
  .cmp-stage{width:100%;max-width:var(--cmp-card-w);justify-self:center}
  .cmp-panel{grid-column:1/-1;order:3;max-height:none;overflow:visible;width:100%;max-width:calc(var(--cmp-card-w)*2 + var(--space)*2);justify-self:center}
  .brand{width:auto}
}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-areas:"field" "right" "left"}
  .topbar{flex-wrap:wrap}
  .search{order:3;flex-basis:100%;max-width:none}
  .podium{padding:var(--space) 0 0;gap:8px}
  .avatar-xl{width:60px;height:60px}
  .avatar-md{width:46px;height:46px}
  .field{flex-direction:column;align-items:center;height:auto}
  .ranking{max-width:none;width:100%;height:70vh}
}

const period = p => { const [y,m] = p.split("-"); return `${MONTHS[+m-1]}/${y.slice(2)}`; };
const periodLong = p => { const [y,m] = p.split("-"); return `${MONTHS[+m-1]}/${y}`; };
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pick(r, weights){ const s = weights.reduce((a,b)=>a+b,0); let x = r()*s; for(let i=0;i<weights.length;i++){ x -= weights[i]; if(x <= 0) return i; } return weights.length-1; }
const bar = (frac, mod = "") => `<svg class="bar ${mod}" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><rect class="bar-track" width="100" height="6"/><rect class="bar-fill" width="${(Math.max(0,Math.min(1,frac))*100).toFixed(1)}" height="6"/></svg>`;
/* ---------- assets (pasta assets/ ao lado do index.html) ---------- */
const ASSETS = "assets/";
const asset = path => encodeURI(ASSETS + path);
/* jogadores com foto: face_<chave>.png (avatar) e card_<chave>.png (carta) */
const PHOTO_KEYS = new Set(("alan_franco arrascaeta bruno_guimaraes campaz casemiro claudinho diego_costa dudu everson everton_ribeiro "
  + "felipe_anderson felipe_melo gonzalo_plata guilherme_arana gustavo_scarpa hulk junior_santos lucas_paqueta marquinhos militao "
  + "moises murilo ney neymar paqueta pedro_rocha raphael_veiga richard_rios richarlison rodrygo savinho soteldo thiago_heleno "
  + "thiago_silva vinicius_junior wendel yuri_alberto").split(" "));
const PHOTO_ALIAS = {neymar_jr:"neymar"};
const photoKey = p => { const k = slug(p.name).replace(/-/g,"_"); const a = PHOTO_ALIAS[k] || k; return PHOTO_KEYS.has(a) ? a : null; };
const CRESTS = {
  "Atlético Mineiro":"Atletico_mineiro.png","Botafogo":"botafogo.png","Corinthians":"Corinthians.png","Cruzeiro":"cruzeiro.png",
  "Grêmio":"Gremio.svg","Lazio":"Lazio.png","Palmeiras":"palmeiras.png","Real Madrid":"Real_Madrid.png",
  "Real Valladolid":"Real_Valladolid.png","Santos":"Santos.png","Tottenham":"Tottenham.png","Vasco":"vasco.webp"
};
/* avatar: iniciais no gradiente do clube como base; a foto (se houver) cobre por cima e some se falhar */
const avatar = (p, size) => { const k = photoKey(p); return `<span class="avatar avatar-${size} club-${slug(p.club)}" aria-hidden="true">${initials(p.name)}${k ? `<img class="avatar-img" src="${asset(`jogadores/face_${k}.png`)}" alt="" loading="lazy">` : ""}</span>`; };
/* brasão: PNG do clube; sem arquivo, cai para as iniciais do clube no gradiente das cores */
const crest = (club, size = "sm") => CRESTS[club]
  ? `<img class="crest crest-${size}" src="${asset("clubes/" + CRESTS[club])}" alt="Escudo do ${club}" title="${club}">`
  : `<span class="avatar crest-fallback crest-${size} club-${slug(club)}" title="${club}">${clubInitials(club)}</span>`;
/* imagem que não carregar some e deixa o fallback (iniciais) visível */
document.addEventListener("error", e => { if(e.target.matches?.(".avatar-img,.holo-photo")) e.target.remove(); }, true);

/* classes de cor por clube (evita estilos inline) */
(function injectClubStyles(){
  const css = Object.entries(CLUB_COLORS).map(([c,[a,b]]) => `.club-${slug(c)}{--c1:${a};--c2:${b}}`).join("\n");
  const el = document.createElement("style"); el.textContent = css; document.head.appendChild(el);
})();

/* ========== DADOS DERIVADOS (depois de PLAYERS — Regra 4) ========== */
const RANKED = PLAYERS.slice()
  .sort((a,b) => b.rating - a.rating || b.min - a.min)
  .map((p,i) => ({...p, rank:i+1, search:norm(`${p.name} ${p.club} ${p.pos} ${POS_LABEL[p.pos]} ${p.nat}`)}));
const BY_ID = Object.fromEntries(RANKED.map(p => [p.id,p]));

/* metric: métrica que ordena o ranking · pos/clubs: filtros cumulativos (OU dentro do grupo, E entre grupos) */
const state = { selected: RANKED[0].id, query: "", metric: "rating", pos: new Set(), clubs: new Set() };

/* ========== MÉTRICAS ORDENÁVEIS E FILTROS ========== */
const int = v => v.toLocaleString("pt-BR");
const METRICS = {
  rating:{label:"Rating geral",      head:"Rating",    get:p=>p.rating, show:p=>fmt(p.rating)},
  g:     {label:"Gols",              head:"Gols",      get:p=>p.g,      show:p=>int(p.g)},
  a:     {label:"Assistências",      head:"Assist.",   get:p=>p.a,      show:p=>int(p.a)},
  tk:    {label:"Desarmes",          head:"Desarmes",  get:p=>p.tk,     show:p=>int(p.tk)},
  cl:    {label:"Cortes",            head:"Cortes",    get:p=>p.cl,     show:p=>int(p.cl)},
  sh:    {label:"Chutes totais",     head:"Chutes",    get:p=>p.sh,     show:p=>int(p.sh)},
  sot:   {label:"Chutes no alvo",    head:"No alvo",   get:p=>p.sot,    show:p=>int(p.sot)},
  shAcc: {label:"Precisão de chute", head:"Prec. %",   get:p=>p.shAcc,  show:p=>fmt(p.shAcc)},
  pt:    {label:"Passes totais",     head:"Passes",    get:p=>p.pt,     show:p=>int(p.pt)},
  pc:    {label:"Passes certos",     head:"Certos",    get:p=>p.pc,     show:p=>int(p.pc)},
  pAcc:  {label:"Precisão de passe", head:"Prec. %",   get:p=>p.pAcc,   show:p=>fmt(p.pAcc)},
  mv:    {label:"Valor de mercado",  head:"€ mi",      get:p=>p.mv,     show:p=>fmt(p.mv)},
  h:     {label:"Altura",            head:"m",         get:p=>p.h,      show:p=>fmt(p.h/100,2)},
  w:     {label:"Peso",              head:"kg",        get:p=>p.w,      show:p=>int(p.w)},
  age:   {label:"Idade",             head:"Anos",      get:p=>p.age,    show:p=>int(p.age)}
};
const POS_GROUPS = {ATA:["FW","LW","RW"], MEI:["CM"], DEF:["CB","LB","RB"], GOL:["GK"]};
const POS_GROUP_LABEL = {ATA:"Ataque", MEI:"Meio-campo", DEF:"Defesa", GOL:"Goleiro"};
const groupOf = pos => Object.keys(POS_GROUPS).find(g => POS_GROUPS[g].includes(pos));
const CLUBS = [...new Set(RANKED.map(p => p.club))].sort((a,b) => a.localeCompare(b,"pt-BR"));

/* lista visível: filtros → ordenação pela métrica ativa (desempate: rating) → colocação */
function currentList(){
  const m = METRICS[state.metric];
  return RANKED
    .filter(p => (!state.pos.size || state.pos.has(groupOf(p.pos))) && (!state.clubs.size || state.clubs.has(p.club)))
    .sort((a,b) => m.get(b) - m.get(a) || a.rank - b.rank)
    .map((p,i) => ({p, n:i+1}));
}

function setMetric(k){
  if(!METRICS[k]) return;
  state.metric = (state.metric === k && k !== "rating") ? "rating" : k;   /* clicar de novo volta ao rating */
  renderRanking();
  $("#rank-list").scrollTop = 0;
  /* a carta em destaque e a ficha passam para o 1º colocado da nova métrica */
  const top = currentList()[0];
  if(top && top.p.id !== state.selected) select(top.p.id);
}
function markMetric(){
  document.querySelectorAll("[data-metric]").forEach(e => {
    const on = e.dataset.metric === state.metric;
    e.classList.toggle("is-metric", on);
    e.setAttribute("aria-pressed", on);
  });
}

/* ========== RENDER: RANKING ========== */
const CROWN = `<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>`;

function renderRanking(){
  const m = METRICS[state.metric], list = currentList(), q = norm(state.query.trim());
  const filtered = state.pos.size || state.clubs.size;
  $("#metric-head").textContent = m.label;
  const pod = $("#podium"), showPod = !q && list.length >= 3;
  pod.hidden = !showPod;
  if(showPod) pod.innerHTML = [1,0,2].map(i => {
    const {p, n} = list[i];
    return `<button class="podium-slot p${n}" data-id="${p.id}" aria-label="${n}º lugar: ${p.name}, ${m.label.toLowerCase()} ${m.show(p)}">
      ${n===1 ? CROWN : ""}
      ${avatar(p, n===1 ? "xl" : "md")}
      <span class="podium-name">${p.name}</span>
      <span class="podium-club">${p.club}</span>
      <span class="podium-rating num">${m.show(p)}</span>
      <span class="podium-place num">${n}º</span>
    </button>`;
  }).join("");
  const rows = q ? list.filter(x => x.p.search.includes(q)) : list.slice(showPod ? 3 : 0);
  $("#list-label").textContent = q ? `${rows.length} resultado${rows.length===1?"":"s"}` : showPod ? "Demais colocados" : "Classificação";
  $("#rank-list").innerHTML = rows.length ? rows.map(({p, n}) => `
    <button class="rank-row" role="listitem" data-id="${p.id}">
      <span class="rank-num num">${String(n).padStart(2,"0")}</span>
      ${avatar(p,"sm")}
      <span class="row-main"><span class="row-name">${p.name}</span><span class="row-sub">${p.club} · ${POS_LABEL[p.pos]}</span></span>
      <span class="row-metric num">${m.show(p)}</span>
    </button>`).join("")
    : (list.length && !showPod && !q) ? "" : `<p class="empty">${q ? `Nenhum jogador encontrado para “${state.query}”` : filtered ? "Nenhum jogador com esses filtros" : ""}.</p>`;
  markActive(); markMetric();
}

/* ========== FILTROS (barra superior) ========== */
function renderFilters(){
  document.querySelectorAll("[data-pos-filter]").forEach(b => {
    const on = state.pos.has(b.dataset.posFilter);
    b.classList.toggle("is-on", on); b.setAttribute("aria-pressed", on);

function buildClubMenu(){
  const count = c => RANKED.filter(p => p.club === c).length;

/* o menu vive direto no <body> (position:fixed) para ficar acima de todos os painéis
   e ter blur de verdade — dentro da topbar ele herdaria o stacking context dela */
function placeClubMenu(){
  const r = $("#club-btn").getBoundingClientRect(), menu = $("#club-menu");
  const w = menu.offsetWidth;
  menu.style.setProperty("--menu-x", `${Math.max(8, Math.min(innerWidth - w - 8, r.right - w))}px`);

function toggleClubMenu(open){
  const menu = $("#club-menu"), btn = $("#club-btn");
  open = open ?? menu.hidden;
  menu.hidden = !open;
  btn.setAttribute("aria-expanded", open);
  if(open) placeClubMenu();

function applyFilters(){ renderFilters(); renderRanking(); $("#rank-list").scrollTop = 0; }

function markActive(){
  document.querySelectorAll("[data-id]").forEach(b => b.classList.toggle("is-active", +b.dataset.id === state.selected));
}

/* ========== RENDER: FICHA TÉCNICA ========== */
/* escala "redonda" para eixos */
function niceScale(min, max, ticks = 4){
  const range = (max - min) || Math.abs(max) || 1;
  const rough = range / ticks, mag = 10 ** Math.floor(Math.log10(rough));
  const step = [1,2,2.5,5,10].find(s => s*mag >= rough) * mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step || step;
  const vals = []; for(let v = lo; v <= hi + step/2; v += step) vals.push(+v.toFixed(6));
  return {lo, hi: vals[vals.length-1], vals};
}

/* gráfico de linha com eixos X (períodos) e Y (valor), grade e marcadores */
function marketChart(hist){
  const W = 340, H = 220, L = 46, R = 14, T = 20, B = 46;
  const vals = hist.map(h => h[1]);
  const {lo, hi, vals:ticks} = niceScale(Math.min(...vals), Math.max(...vals));
  const n = hist.length;
  const x = i => L + i*(W-L-R)/(n-1);
  const y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);
  const pts = vals.map((v,i) => [x(i), y(v)]);
  const line = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const base = H - B;
  const area = `M${pts[0][0].toFixed(1)},${base} L${line.replace(/ /g," L")} L${pts[n-1][0].toFixed(1)},${base} Z`;
  marketChart.last = {pts, base};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor de mercado por período de registro">
    <defs><linearGradient id="chart-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="chart-stop-a"/><stop offset="1" class="chart-stop-b"/></linearGradient></defs>
    ${ticks.map(t => `<line class="chart-grid" x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="chart-tick" x="${L-6}" y="${(y(t)+3.5).toFixed(1)}" text-anchor="end">${fmt(t, t % 1 ? 1 : 0)}</text>`).join("")}
    <line class="chart-axis" x1="${L}" x2="${L}" y1="${T-6}" y2="${base}"/>
    <line class="chart-axis" x1="${L}" x2="${W-R}" y1="${base}" y2="${base}"/>
    ${hist.map((h,i) => `<line class="chart-axis" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${base}" y2="${base+4}"/><text class="chart-tick" x="${x(i).toFixed(1)}" y="${base+16}" text-anchor="middle">${period(h[0])}</text>`).join("")}
    <path class="chart-area" d="${area}" fill="url(#chart-g)"/>
    <polyline class="chart-line" points="${line}"/>
    ${pts.map((p,i) => `<text class="chart-val${i===n-1?" last":""}" x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" text-anchor="middle">${fmt(vals[i])}</text><circle class="chart-dot${i===n-1?" last":""}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"><title>${periodLong(hist[i][0])}: € ${fmt(vals[i])} mi</title></circle>`).join("")}
    <text class="chart-title" x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">Período de registro</text>
    <text class="chart-title" x="11" y="${(T+base)/2}" text-anchor="middle" transform="rotate(-90 11 ${(T+base)/2})">Valor (€ mi)</text>
  </svg>`;
}

function renderBio(p){
  const h = p.mvh, last = h[h.length-1], prev = h[h.length-2], first = h[0];
  const d = last[1] - prev[1], pct = d / prev[1] * 100;
  const total = (last[1] - first[1]) / first[1] * 100;
  const deltaHTML = Math.abs(d) < 0.05
    ? `<span class="delta delta-flat">Sem alteração vs ${period(prev[0])}</span>`
    : `<span class="delta ${d>0?"delta-up":"delta-down"} num">${d>0?"▲ +":"▼ −"}${fmt(Math.abs(d))} mi (${d>0?"+":"−"}${fmt(Math.abs(pct))}%)</span>`;
  $("#bio").innerHTML = `
  <div class="card">
    <div class="bio-head">
      ${avatar(p,"lg")}
      <div class="bio-id">
        <span class="bio-name">${p.name}</span>
        <span class="bio-phys bio-phys-main num"><span class="metric metric-inline" data-metric="h" role="button" tabindex="0" title="Ordenar ranking por altura">${fmt(p.h/100,2)} m</span> · <span class="metric metric-inline" data-metric="w" role="button" tabindex="0" title="Ordenar ranking por peso">${p.w} kg</span> · <span class="metric metric-inline" data-metric="age" role="button" tabindex="0" title="Ordenar ranking por idade">${p.age} anos</span></span>
        <span class="bio-sub">${p.nat}</span>
      </div>
    </div>
    <div class="info-row">
      <div><span class="label">Clube atual</span><span class="info-strong club-line">${crest(p.club)}${p.club}</span><span class="bio-sub">${POS_LABEL[p.pos]}</span></div>
      <div><span class="label">Contrato até</span><span class="info-strong num">${periodLong(p.contract)}</span></div>
    </div>
    <div class="market">
      <div class="market-top">
        <div class="info-row metric" data-metric="mv" role="button" tabindex="0" title="Ordenar ranking por valor de mercado"><div><span class="label">Valor de mercado</span><span class="market-value num">€ ${fmt(p.mv)} <small>mi</small></span></div></div>
        ${deltaHTML}
      </div>
      ${marketChart(h)}
      <span class="market-foot">${total>=0?"Valorização":"Desvalorização"} de <b class="${total>=0?"delta-up":"delta-down"} num">${fmt(Math.abs(total))}%</b> desde ${periodLong(first[0])} · ${h.length} registros.</span>
    </div>
  </div>`;
  /* linha, área, marcadores e rótulos deslizam até os valores do novo jogador */
  const svg = $("#bio .chart"), {base} = marketChart.last;
  const line = svg.querySelector(".chart-line"), area = svg.querySelector(".chart-area");
  const dots = [...svg.querySelectorAll(".chart-dot")], vals = [...svg.querySelectorAll(".chart-val")];
  tweenPoints("market", marketChart.last.pts, pts => {
    const l = pts.map(q => `${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(" ");
    line.setAttribute("points", l);
    area.setAttribute("d", `M${pts[0][0].toFixed(1)},${base} L${l.replace(/ /g," L")} L${pts[pts.length-1][0].toFixed(1)},${base} Z`);
    dots.forEach((d,i) => { d.setAttribute("cx", pts[i][0].toFixed(1)); d.setAttribute("cy", pts[i][1].toFixed(1)); });
    vals.forEach((t,i) => { t.setAttribute("x", pts[i][0].toFixed(1)); t.setAttribute("y", (pts[i][1]-9).toFixed(1)); });
  });
}

/* ========== RENDER: PERFIL DE DESEMPENHO ========== */
const RADAR_AXES = [["Gols","g"],["Finalizações","sot"],["Desarmes","tk"],["Cortes","cl"],["Passes","pc"],["Assistências","a"]];
const STAT_MAX = Object.fromEntries(RADAR_AXES.map(([,k]) => [k, Math.max(...PLAYERS.map(p => p[k]))]));
/* faixas de precisão: [limite baixa, limite média] em % */
const ACC_BANDS = { shot:[30,40], pass:[75,85] };

function radarChart(p){
  const W = 340, H = 256, cx = 170, cy = 132, R = 78, n = RADAR_AXES.length;
  const ang = i => (-90 + i*360/n) * Math.PI/180;
  const pt = (i, r) => [cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))];
  const poly = r => RADAR_AXES.map((_,i) => pt(i,r).map(v => v.toFixed(1)).join(",")).join(" ");
  const rings = [.25,.5,.75,1].map(f => `<polygon class="radar-ring${f===1?" outer":""}" points="${poly(R*f)}"/>`).join("");
  const spokes = RADAR_AXES.map((_,i) => { const [x,y] = pt(i,R); return `<line class="radar-spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join("");
  const data = RADAR_AXES.map(([,k],i) => pt(i, R*Math.min(1, p[k]/STAT_MAX[k])));
  radarChart.last = data;
  const labels = RADAR_AXES.map(([l,k],i) => {
    const [x,y] = pt(i, R+16), c = Math.cos(ang(i)), s = Math.sin(ang(i));
    const anchor = c > .3 ? "start" : c < -.3 ? "end" : "middle";
    const y0 = s < -.9 ? y - 14 : s > .9 ? y + 4 : y - 4;
    /* cada eixo é clicável: retângulo invisível amplia a área de clique em volta do rótulo */
    const bx = anchor === "start" ? x - 4 : anchor === "end" ? x - 92 : x - 48;
    return `<g class="radar-axis metric" data-metric="${k}" role="button" tabindex="0"><title>Ordenar ranking por ${l.toLowerCase()}</title>
            <rect class="radar-hit" x="${bx.toFixed(1)}" y="${(y0-12).toFixed(1)}" width="96" height="32" rx="8"/>
            <text class="radar-label" x="${x.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}">${l}</text>
            <text class="radar-value" x="${x.toFixed(1)}" y="${(y0+15).toFixed(1)}" text-anchor="${anchor}">${p[k].toLocaleString("pt-BR")}</text></g>`;
  }).join("");
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar de atributos de ${p.name}">
    ${rings}${spokes}
    <polygon class="radar-area" points="${data.map(d => d.map(v => v.toFixed(1)).join(",")).join(" ")}"/>
    ${data.map(([x,y],i) => `<circle class="radar-dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"><title>${RADAR_AXES[i][0]}: ${p[RADAR_AXES[i][1]]} (máx. da liga ${STAT_MAX[RADAR_AXES[i][1]]})</title></circle>`).join("")}
    ${labels}
  </svg>`;
}

/* medidor de precisão (semicírculo com faixas vermelha / amarela / verde) */
function gauge(pct, [low, mid], label, key){
  const cx = 60, cy = 58, r = 46;
  const P = v => { const a = Math.PI * (1 - v/100); return [(cx + r*Math.cos(a)).toFixed(2), (cy - r*Math.sin(a)).toFixed(2)]; };
  const arc = (a, b) => { const [x1,y1] = P(a), [x2,y2] = P(b); return `M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}`; };
  const band = pct < low ? "band-low" : pct < mid ? "band-mid" : "band-high";
  const bandName = {"band-low":"Baixa","band-mid":"Média","band-high":"Alta"}[band];
  const a = Math.PI * (1 - pct/100), nx = cx + (r-14)*Math.cos(a), ny = cy - (r-14)*Math.sin(a);
  return `<div class="gauge metric" data-metric="${key}" role="button" tabindex="0" title="Ordenar ranking por ${label.toLowerCase()}">
    <span class="label">${label}</span>
    <svg viewBox="0 0 120 66" role="img" aria-label="${label}: ${fmt(pct)}%, precisão ${bandName.toLowerCase()}">
      <path class="gauge-track band-low" d="${arc(0,low)}"/>
      <path class="gauge-track band-mid" d="${arc(low,mid)}"/>
      <path class="gauge-track band-high" d="${arc(mid,100)}"/>
      ${pct > 0 ? `<path class="gauge-arc ${band}" d="${arc(0, Math.max(.5, pct))}"/>` : ""}
      <line class="gauge-needle" x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}"/>
      <circle class="gauge-hub" cx="${cx}" cy="${cy}" r="4"/>
    </svg>
    <span class="gauge-value num ${band}">${fmt(pct)}%</span>
  </div>`;
}

function renderPerf(p){
  const top = Math.max(1, Math.round(p.rank / RANKED.length * 100));
  const tile = (l, v, k) => `<div class="tile metric" data-metric="${k}" role="button" tabindex="0" title="Ordenar ranking por ${l.toLowerCase()}"><span class="label">${l}</span><span class="tile-value num">${v.toLocaleString("pt-BR")}</span></div>`;
  $("#perf").innerHTML = `
  <div class="card">
    <div class="rating-hero metric" data-metric="rating" role="button" tabindex="0" title="Ordenar ranking por rating geral">
      <span class="rating-big num">${fmt(p.rating)}</span>
      <div class="rating-meta">
        <span class="label">Rating geral · de 10</span>
        ${bar(p.rating/10)}
        <span class="bio-sub">${p.rank}º de ${RANKED.length} · top ${top}% da liga</span>
      </div>
    </div>
    ${radarChart(p)}
    <span class="radar-note">Escala: maior valor da liga em cada atributo = borda do radar</span>
    <div class="stat-cols">
      <div class="stat-col">${tile("Chutes totais", p.sh, "sh")}${tile("Chutes no alvo", p.sot, "sot")}${gauge(p.shAcc, ACC_BANDS.shot, "Precisão de chute", "shAcc")}</div>
      <div class="stat-col">${tile("Passes totais", p.pt, "pt")}${tile("Passes certos", p.pc, "pc")}${gauge(p.pAcc, ACC_BANDS.pass, "Precisão de passe", "pAcc")}</div>
    </div>
  </div>`;
  /* os pontos do radar deslizam da posição do jogador anterior até a do novo */
  const poly = $("#perf .radar-area"), dots = [...document.querySelectorAll("#perf .radar-dot")];
  tweenPoints("radar", radarChart.last, pts => {
