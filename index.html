    dots.forEach((d,i) => { d.setAttribute("cx", pts[i][0].toFixed(1)); d.setAttribute("cy", pts[i][1].toFixed(1)); });
  });
}

/* ---------- interpolação de pontos (radar e valor de mercado) ----------
   guarda a posição atual de cada gráfico; ao trocar de jogador, anima de onde
   os pontos estão (mesmo no meio de outra animação) até o destino novo */
const TWEENS = {};
function tweenPoints(key, to, apply, ms = 650){
  const prev = TWEENS[key];
  if(prev) cancelAnimationFrame(prev.raf);
  const from = prev && prev.cur.length === to.length ? prev.cur : null;
  const st = TWEENS[key] = { cur: from || to, raf: 0 };
  if(!from || matchMedia("(prefers-reduced-motion: reduce)").matches){ st.cur = to; apply(to); return; }
  const t0 = performance.now(), ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = ease(t);
    st.cur = to.map((p,i) => [from[i][0] + (p[0]-from[i][0])*e, from[i][1] + (p[1]-from[i][1])*e]);
    apply(st.cur);
    if(t < 1) st.raf = requestAnimationFrame(step);
  };
  apply(from);
  st.raf = requestAnimationFrame(step);
}

/* ========== RENDER: MAPA DE PRESENÇA (campo 3D) ========== */
/* campo de presença estimado: soma de gaussianas nas zonas da posição (x 0..105 rumo ao ataque, y 0..68 da esquerda p/ direita) */
function heatGrid(p, cols = 16, rows = 24){
  const r = rng(p.id);
  const zs = (ZONES[p.pos] || ZONES.CM).map(z => [z[0]+(r()-.5)*10, z[1]+(r()-.5)*8, z[2]*(.8+r()*.4), z[3], z[4]]);
  zs.push([20+r()*65, 8+r()*52, .22, 8, 8]);
  const grid = []; let max = 0;
  for(let row=0; row<rows; row++) for(let c=0; c<cols; c++){
    /* no campo 3D a linha 0 é a goleira do fundo (ataque) e a coluna 0 é o lado esquerdo */
    const x = (1 - (row+.5)/rows) * 105, y = (c+.5)/cols * 68;
    let v = 0;
    for(const [zx,zy,w,sx,sy] of zs) v += w*Math.exp(-((x-zx)**2/(2*sx*sx) + (y-zy)**2/(2*sy*sy)));
    v *= .9 + r()*.2;
    grid.push(v); if(v > max) max = v;
  }
  return {grid: grid.map(v => v/max), cols, rows};
}

/* --- componente CAMPO 3D (origem: elementos/campo3d_card.html) ---
   uso: const c = campo3D(el, {cols, rows}); c.pintar(grade 0..1)
   calor e brilho desenhados em SVG por atributos (sem estilo inline). */
const C3_STOPS = [[47,127,214],[56,217,138],[245,206,59],[255,107,107]];   /* azul aux. → verde → dourado → vermelho */
function c3Cor(w){
  const t = Math.max(0,Math.min(1,w))*(C3_STOPS.length-1);
  const i = Math.min(C3_STOPS.length-2,Math.floor(t)), f = t-i, a = C3_STOPS[i], b = C3_STOPS[i+1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}
function c3Op(w){ const t = Math.max(0,Math.min(1,(w-.10)/(.55-.10))); return t*t*(3-2*t)*.94; }
const C3_HTML = `
<div class="c3-sombra"></div>
<div class="c3-flutua"><div class="c3-cena">
  <div class="c3-topo">
    <div class="c3-pista">
      <svg class="c3-calor" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <svg class="c3-brilho" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs><radialGradient id="c3-glow"><stop offset="0" class="c3-glow-a"/><stop offset=".7" stop-opacity="0"/></radialGradient></defs>
        <ellipse rx="17" ry="11" fill="url(#c3-glow)"/>
      </svg>
    </div>
    <div class="c3-linhas">
      <i class="borda"></i><i class="meio"></i><i class="circulo"></i>
      <i class="area n"></i><i class="area s"></i><i class="pequena n"></i><i class="pequena s"></i>
      <i class="ponto centro"></i><i class="ponto pn"></i><i class="ponto ps"></i>
      <i class="canto no"></i><i class="canto ne"></i><i class="canto so"></i><i class="canto se"></i>
    </div>
    <div class="c3-sombra-gol n"></div><div class="c3-sombra-gol s"></div>
  </div>
  <div class="c3-lado s"></div><div class="c3-lado o"></div>
  <div class="c3-gol n"></div><div class="c3-gol s"></div>
</div></div>
<div class="c3-poeira"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>`;

function campo3D(el, opts){
  const o = Object.assign({cols:16, rows:24}, opts || {});
  el.innerHTML = C3_HTML;
  const topo = el.querySelector(".c3-topo"), calor = el.querySelector(".c3-calor");
  const brilhoSvg = el.querySelector(".c3-brilho"), glow = el.querySelector("ellipse"), stop = el.querySelector(".c3-glow-a");
  return {
    pintar(g){
      const cw = 100/o.cols, ch = 100/o.rows;
      let pico = 0, px = 50, py = 50, html = "";
      g.forEach((w,i) => {
        const c = i % o.cols, r = Math.floor(i / o.cols);
        if(w > pico){ pico = w; px = (c+.5)*cw; py = (r+.5)*ch; }
        const op = c3Op(w);
        if(op > .01) html += `<rect x="${(c*cw).toFixed(2)}" y="${(r*ch).toFixed(2)}" width="${(cw+.9).toFixed(2)}" height="${(ch+.9).toFixed(2)}" fill="${c3Cor(w)}" opacity="${op.toFixed(2)}"/>`;
      });
      calor.innerHTML = html;
      glow.setAttribute("cx", px.toFixed(1)); glow.setAttribute("cy", py.toFixed(1));
      stop.setAttribute("stop-color", c3Cor(pico));
      brilhoSvg.setAttribute("opacity", (.20 + .32*pico).toFixed(2));
      topo.classList.remove("trocando"); void topo.offsetWidth; topo.classList.add("trocando");
    }
  };
}

let CAMPO = null;
function renderHeatmap(p){
  const {grid, cols, rows} = heatGrid(p);
  if(!CAMPO) CAMPO = campo3D($("#campo3d"), {cols, rows});
  CAMPO.pintar(grid);
  /* terços (por linha) e zona dominante */
  const sum = [0,0,0]; let best = 0;
  grid.forEach((v,i) => {
    const row = Math.floor(i/cols), x = (1-(row+.5)/rows)*105;
    sum[x < 35 ? 0 : x < 70 ? 1 : 2] += v; if(v > grid[best]) best = i;
  });
  const tot = sum[0]+sum[1]+sum[2], pct = sum.map(s => Math.round(s/tot*100));
  const bRow = Math.floor(best/cols), bCol = best % cols;
  const bx = (1-(bRow+.5)/rows)*105, by = (bCol+.5)/cols*68;
  const bt = bx < 35 ? "Terço defensivo" : bx < 70 ? "Meio-campo" : "Terço ofensivo";
  const corr = by < 22.7 ? "corredor esquerdo" : by < 45.3 ? "corredor central" : "corredor direito";
  $("#campo3d").setAttribute("aria-label", `Mapa de presença de ${p.name}: mais presente no ${bt.toLowerCase()}, ${corr}`);
  const thirdName = ["Defensivo","Meio-campo","Ofensivo"];
  $("#heat-info").innerHTML = `
    <div class="pitch-dir"><span>Defesa · gol da frente</span><span>Ataque · gol do fundo</span></div>
    <div class="heat-legend"><span>Baixa</span><span class="heat-scale"></span><span>Alta</span></div>
    <div class="divider"></div>
    <div class="info-row"><div><span class="label">Zona dominante</span><span class="info-strong">${bt} · ${corr}</span></div></div>
    <div class="thirds">
      ${pct.map((v,k) => `<div class="tile"><span class="label">${thirdName[k]}</span><span class="tile-value num">${v}%</span>${bar(v/100,"bar-thin")}</div>`).join("")}
    </div>`;
}

/* ========== RENDER: PÊNALTIS (goleira 3D) ========== */
/* cobranças simuladas; posição em coordenadas da BOCA do gol: u 0..1 (esq→dir), v 0..1 (chão→travessão) */
function penaltyData(p){
  const r = rng(p.id*7 + 3);
  const base = {FW:6,LW:4,RW:4,CM:3,LB:1,RB:1,CB:1,GK:0}[p.pos] ?? 1;
  const taken = Math.round(base * (.35 + r()*.9) * Math.min(1, p.apps/15));
  const scored = Math.min(p.g, Math.round(taken * (.6 + r()*.35)));
  const misses = taken - scored, saved = Math.round(misses * (.4 + r()*.4));
  const goalW = [3,1,3, 2,1,2, 4,1.5,4], saveW = [1,1,1, 2,2,2, 3,3,3];
  const kicks = [];
  const cl = v => Math.max(.05, Math.min(.95, v));
  for(let k=0;k<taken;k++){
    const type = k < scored ? "goal" : k < scored + saved ? "saved" : "out";
    if(type === "out"){
      const side = pick(r,[2,1,1]);
      kicks.push(side === 0 ? {type, u:.12 + r()*.76, v:1.08 + r()*.03} : {type, u: side === 1 ? -.035 : 1.035, v:.15 + r()*.6});
    } else {
      const z = pick(r, type === "goal" ? goalW : saveW);
      kicks.push({type, z, u: cl((z%3 + .5)/3 + (r()-.5)*.18), v: cl(1 - (Math.floor(z/3) + .5)/3 + (r()-.5)*.16)});
    }
  }
  return {taken, scored, saved, out: misses - saved, kicks};
}

/* --- componente GOLEIRA 3D (origem: elementos/goleira_card.html) — Canvas 2D, rede ao vento ---
   API: boca(u,v) → px CSS no plano da boca do gol; caixa() → [w,h]; aoRedimensionar() */
function goleiraCard(canvas, opts){
  const o = Object.assign({vento:.6, grama:1}, opts || {});
  const ctx = canvas.getContext("2d");
  const GW=7.32, GH=2.44, HW=GW/2, DEEP=1.95;
  const EYE=[-3.05,1.70,7.55], TGT=[0.05,1.00,-0.55];
  const WDX=0.93, WDZ=0.37;
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const nrm=a=>{ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; };
  const FWD=nrm(sub(TGT,EYE)), RGT=nrm(cross(FWD,[0,1,0])), UPV=cross(RGT,FWD);
  let F=1, CX=0, CY=0, W=0, H=0, DPR=1;
  function proj(x,y,z){
    const dx=x-EYE[0], dy=y-EYE[1], dz=z-EYE[2];
    const d=dx*FWD[0]+dy*FWD[1]+dz*FWD[2], s=F/(d>0.15?d:0.15);
    return [CX+(dx*RGT[0]+dy*RGT[1]+dz*RGT[2])*s, CY-(dx*UPV[0]+dy*UPV[1]+dz*UPV[2])*s, d];
  }
  function vento(x,z,t){
    const s=0.55*Math.sin(0.55*x+0.30*z-1.45*t)+0.30*Math.sin(0.90*x-0.42*z-2.30*t+1.7)+0.15*Math.sin(1.70*x+0.60*z-3.40*t+4.1);
    return s*(0.58+0.42*Math.sin(t*0.41)*Math.sin(t*0.26+1.1));
  }
  const PROF=[[0,1],[0.30,0.982],[0.52,0.885],[0.70,0.700],[0.85,0.440],[0.95,0.200],[1,0]];
  function perfil(v){
    const f=Math.min(Math.max(v,0),1)*(PROF.length-1), i=Math.min(Math.floor(f),PROF.length-2), k=f-i;
    return [-DEEP*(PROF[i][0]+(PROF[i+1][0]-PROF[i][0])*k), GH*(PROF[i][1]+(PROF[i+1][1]-PROF[i][1])*k)];
  }
  const TONS=["#16351d","#1c4023","#234c29","#2a5931","#33693a"], LARG=[0.8,1.4,2.2,3.2];
  let grupos=[];
  function noChao(sx,sy){
    const a=(sx-CX)/F, b=-(sy-CY)/F, dy=FWD[1]+a*RGT[1]+b*UPV[1];
    if(dy>-1e-4) return null;
    const k=-EYE[1]/dy; if(k>27) return null;
    return [EYE[0]+k*(FWD[0]+a*RGT[0]+b*UPV[0]), EYE[2]+k*(FWD[2]+a*RGT[2]+b*UPV[2]), k];
  }
  function semear(){
    const horY=proj(0,0,-900)[1];
    grupos=TONS.flatMap(c=>LARG.map(l=>({cor:c, lw:l*DPR, atras:[], frente:[]})));
    const y0=Math.max(horY+2,0), faixa=(H+14)-y0; if(faixa<=0) return;
    const alvo=Math.round(Math.min(2200,(W+20)*faixa/(52*DPR*DPR))*o.grama);
    let seed=20260804, feitas=0, tent=0;
    const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
    while(feitas<alvo && tent++<alvo*8){
      const g=noChao(-10+rnd()*(W+20), y0+rnd()*faixa); if(!g) continue;
      feitas++;
      const k=g[2];
      const lam={x:g[0], z:g[1], h:(0.040+rnd()*0.055)*Math.min(1.85,1+0.036*k), rig:0.55+rnd()*0.85, fase:rnd()*6.28, pend:(rnd()-0.5)*0.55};
      let ti=Math.round(rnd()*4); if(k>11) ti=Math.max(0,ti-1);
      const px=(0.011+rnd()*0.010)*F/k, li=px<1.1?0:px<1.8?1:px<2.8?2:3;
      const gr=grupos[ti*LARG.length+li];
      (lam.z<-0.05?gr.atras:gr.frente).push(lam);
    }
  }
  function chao(){
    const hor=proj(0,0,-900)[1];
    const g=ctx.createLinearGradient(0,hor,0,H);
    g.addColorStop(0,"#152d1c"); g.addColorStop(0.32,"#1d4325"); g.addColorStop(0.70,"#20492a"); g.addColorStop(1,"#22502d");
    ctx.fillStyle=g; ctx.fillRect(0,hor,W,H-hor);
    for(let i=-8;i<8;i+=2){
      const a=proj(i*1.85,0,-60), b=proj(i*1.85+1.85,0,-60), c=proj(i*1.85+1.85,0,5.4), d=proj(i*1.85,0,5.4);
      ctx.fillStyle="rgba(255,255,255,.022)";
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(d[0],d[1]); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.lineWidth=Math.max(1,1.6*DPR);
    const l0=proj(-11,0.005,0), l1=proj(11,0.005,0);
    ctx.beginPath(); ctx.moveTo(l0[0],l0[1]); ctx.lineTo(l1[0],l1[1]); ctx.stroke();
    const c=proj(0,0,-DEEP*0.45), r=(proj(HW+0.7,0,-DEEP*0.45)[0]-proj(-HW-0.7,0,-DEEP*0.45)[0])*0.5;
    const sg=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],r);
    sg.addColorStop(0,"rgba(0,0,0,.42)"); sg.addColorStop(0.6,"rgba(0,0,0,.18)"); sg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.save(); ctx.translate(c[0],c[1]); ctx.scale(1,0.19); ctx.translate(-c[0],-c[1]);
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(c[0],c[1],r,0,6.2832); ctx.fill(); ctx.restore();
  }
  function grama(t,campo){
    ctx.lineCap="round";
    for(const g of grupos){
      const lista=g[campo]; if(!lista.length) continue;
      ctx.strokeStyle=g.cor; ctx.lineWidth=g.lw; ctx.beginPath();
      for(const b of lista){
        const w=vento(b.x,b.z,t+b.fase*0.05)*o.vento/b.rig;
        const dx=(WDX*w+b.pend)*b.h*0.85, dz=(WDZ*w+b.pend*0.4)*b.h*0.85, hy=b.h*(0.98-0.22*Math.abs(w));
        const p0=proj(b.x,0,b.z), p1=proj(b.x+dx*0.30,hy*0.58,b.z+dz*0.30), p2=proj(b.x+dx,hy,b.z+dz);
        ctx.moveTo(p0[0],p0[1]); ctx.quadraticCurveTo(p1[0],p1[1],p2[0],p2[1]);
      }
      ctx.stroke();
    }
  }
  const NU=23, NV=13, SU=10, SV=9, gridFundo=[], gridLat=[[],[]];
  function malha(t){
    const amp=0.30*o.vento;
    for(let j=0;j<NV;j++){
      const v=j/(NV-1), pr=perfil(v);
      for(let i=0;i<NU;i++){
        const u=i/(NU-1), x=-HW+GW*u;
        const bojo=Math.sin(Math.PI*u)*Math.sin(Math.PI*Math.min(v*1.12,1));
        const w=vento(x,pr[0],t)*amp*bojo;
        gridFundo[j*NU+i]=proj(x+w*0.30, pr[1]+w*0.22, pr[0]+w*0.92);
      }
    }
    for(let s=0;s<2;s++){
      const sx=s?HW:-HW;
      for(let i=0;i<SU;i++){
        const v=i/(SU-1), pr=perfil(v);
        for(let j=0;j<SV;j++){
          const f=j/(SV-1), y=pr[1]*f, bojo=Math.sin(Math.PI*v)*Math.sin(Math.PI*f);
          const w=vento(sx,pr[0],t)*amp*bojo*0.8;
          gridLat[s][i*SV+j]=proj(sx+w*(s?0.95:-0.95), y+w*0.10, pr[0]+w*0.20);
        }
      }
    }
  }
  function tracar(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.stroke(); }
  function rede(){
    ctx.lineWidth=Math.max(0.6,0.95*DPR); ctx.lineJoin="round";
    for(let s=0;s<2;s++){
      ctx.strokeStyle=s?"rgba(226,240,232,.24)":"rgba(226,240,232,.32)";
      for(let i=0;i<SU;i++){ const c=[]; for(let j=0;j<SV;j++) c.push(gridLat[s][i*SV+j]); tracar(c); }
      for(let j=0;j<SV;j++){ const r=[]; for(let i=0;i<SU;i++) r.push(gridLat[s][i*SV+j]); tracar(r); }
    }
    ctx.strokeStyle="rgba(232,244,236,.38)";
    for(let i=0;i<NU;i++){ const c=[]; for(let j=0;j<NV;j++) c.push(gridFundo[j*NU+i]); tracar(c); }
    for(let j=0;j<NV;j++){ const r=[]; for(let i=0;i<NU;i++) r.push(gridFundo[j*NU+i]); tracar(r); }
  }
  function tubo(a,b,esp,cor,passos){
    ctx.strokeStyle=cor; ctx.lineCap="round";
    for(let k=0;k<passos;k++){
      const t0=k/passos, t1=(k+1)/passos;
      const p=proj(a[0]+(b[0]-a[0])*t0,a[1]+(b[1]-a[1])*t0,a[2]+(b[2]-a[2])*t0);
      const q=proj(a[0]+(b[0]-a[0])*t1,a[1]+(b[1]-a[1])*t1,a[2]+(b[2]-a[2])*t1);
      ctx.lineWidth=Math.max(1,esp*F/((p[2]+q[2])*0.5));
      ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
    }
  }
  function estrutura(){
    tubo([-HW,0.02,-DEEP],[HW,0.02,-DEEP],0.042,"rgba(214,228,220,.45)",8);
    tubo([-HW,0.02,0],[-HW,0.02,-DEEP],0.05,"rgba(214,228,220,.45)",5);
    tubo([HW,0.02,0],[HW,0.02,-DEEP],0.05,"rgba(214,228,220,.45)",5);
    tubo([-HW,0,0],[-HW,GH,0],0.12,"#eef4f0",3);
    tubo([HW,0,0],[HW,GH,0],0.12,"#dfe8e3",3);
    tubo([-HW,GH,0],[HW,GH,0],0.12,"#eef4f0",14);
    tubo([-HW,GH+0.035,0],[HW,GH+0.035,0],0.03,"rgba(255,255,255,.55)",14);
  }
  function medir(){
    const r=canvas.getBoundingClientRect();
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=Math.max(2,Math.round(r.width*DPR)); H=Math.max(2,Math.round(r.height*DPR));
    if(canvas.width!==W || canvas.height!==H){
      canvas.width=W; canvas.height=H; F=1; CX=0; CY=0;
      let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
      for(const q of [[-HW,0,0],[HW,0,0],[-HW,GH,0],[HW,GH,0],[-HW,0,-DEEP],[HW,0,-DEEP]]){
        const s=proj(q[0],q[1],q[2]);
        if(s[0]<x0)x0=s[0]; if(s[0]>x1)x1=s[0]; if(s[1]<y0)y0=s[1]; if(s[1]>y1)y1=s[1];
      }
      F=Math.min(W*0.84/(x1-x0), H*0.66/(y1-y0));
      CX=W*0.5-(x0+x1)*0.5*F;
      CY=H*0.12-y0*F;
      semear();
      if(o.aoRedimensionar) o.aoRedimensionar();
    }
  }
  function desenhar(t){ medir(); ctx.clearRect(0,0,W,H); chao(); grama(t,"atras"); malha(t); rede(); estrutura(); grama(t,"frente"); }
  let raf=0, t0=null, visivel=true;
  const parado=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(ms){ if(t0===null) t0=ms; desenhar((ms-t0)/1000); raf=visivel&&!parado?requestAnimationFrame(frame):0; }
  if(parado) requestAnimationFrame(()=>desenhar(3.2));
  else new IntersectionObserver(es=>{ visivel=es[0].isIntersecting; if(visivel&&!raf) raf=requestAnimationFrame(frame); },{threshold:0.01}).observe(canvas);
  addEventListener("resize", ()=>{ if(!raf) requestAnimationFrame(()=>desenhar(3.2)); });
  return {
    boca(u,v){ const q=proj(-HW+GW*u, GH*v, 0); return [q[0]/DPR, q[1]/DPR]; },
    caixa(){ return [W/DPR, H/DPR]; },
    pronto(){ return W > 2; }
  };
}

let GOL = null, PEN = null;
function drawKicks(){
  if(!GOL || !PEN || !GOL.pronto()) return;
  const [w,h] = GOL.caixa(), svg = $("#goal-overlay");
  svg.setAttribute("viewBox", `0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  const zoneCount = Array(9).fill(0);
  PEN.kicks.forEach(k => { if(k.z !== undefined) zoneCount[k.z]++; });
  const zmax = Math.max(1, ...zoneCount);
  const quad = (u0,v0,u1,v1) => [GOL.boca(u0,v0),GOL.boca(u1,v0),GOL.boca(u1,v1),GOL.boca(u0,v1)].map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const zones = zoneCount.map((n,z) => {
    const u0 = (z%3)/3, v1 = 1 - Math.floor(z/3)/3, pts = quad(u0, v1-1/3, u0+1/3, v1);
    return `${n ? `<polygon class="goal-zone-fill" points="${pts}" fill-opacity="${(n/zmax*.22).toFixed(2)}"/>` : ""}<polygon class="goal-zone" points="${pts}"/>`;
  }).join("");
  const label = {goal:"Gol", saved:"Defendido", out:"Para fora"};
  const kicks = PEN.kicks.map(k => {
    const [x,y] = GOL.boca(k.u, k.v), t = `<title>${label[k.type]}</title>`;
    if(k.type === "goal") return `<circle class="kick-goal" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6">${t}</circle>`;
    if(k.type === "saved") return `<g><circle class="kick-saved" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6">${t}</circle><path class="kick-saved-x" d="M${(x-2.6).toFixed(1)},${(y-2.6).toFixed(1)}l5.2,5.2m0,-5.2l-5.2,5.2"/></g>`;
    return `<circle class="kick-out" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6">${t}</circle>`;
  }).join("");
  svg.innerHTML = zones + kicks;
}

function renderPenalties(p){
  PEN = penaltyData(p);
  if(!GOL) GOL = goleiraCard($("#goal-canvas"), {vento:.6, aoRedimensionar: () => requestAnimationFrame(drawKicks)});
  drawKicks();
  const d = PEN, conv = d.taken ? Math.round(d.scored/d.taken*100) : 0;
  $("#pen-info").innerHTML = `
    ${d.taken ? `<div class="legend"><span><i class="dot dot-goal"></i>Gol</span><span><i class="dot dot-saved"></i>Defendido</span><span><i class="dot dot-out"></i>Para fora</span></div>`
              : `<p class="pen-empty">${p.pos === "GK" ? "Goleiro — sem cobranças na temporada." : "Nenhuma cobrança de pênalti na temporada."}</p>`}
    <div class="tiles pen-tiles">
      <div class="tile"><span class="label">Cobrados</span><span class="tile-value num">${d.taken}</span><span class="tile-note">na temporada</span></div>
      <div class="tile"><span class="label">Convertidos</span><span class="tile-value green num">${d.scored}</span><span class="tile-note num">${conv}% de acerto</span></div>
      <div class="tile"><span class="label">Perdidos</span><span class="tile-value red num">${d.taken - d.scored}</span><span class="tile-note num">${d.saved} def. · ${d.out} fora</span></div>
    </div>`;
}

/* ========== RENDER: CARTA HOLOGRÁFICA ========== */
/* origem: elementos/carta_holografica.html — mecanismo de mola/luz adaptado de
   github.com/simeydotme/pokemon-cards-css (MIT). As variáveis de ponteiro são
   estado de animação escrito em runtime (não estilo de layout). */
const POS_ABBR = {GK:"GOL",CB:"ZAG",LB:"LE",RB:"LD",CM:"MC",LW:"PE",RW:"PD",FW:"ATA"};
const FLAGS = {"Brasil":"🇧🇷","Uruguai":"🇺🇾","Colômbia":"🇨🇴","Equador":"🇪🇨","Espanha":"🇪🇸","Venezuela":"🇻🇪"};
const clubInitials = c => { const w = c.split(/[\s-]+/).filter(x => x.length > 2 || /^[A-Z]{2,}$/.test(x)); return (w.length > 1 ? w.map(x => x[0]).join("").slice(0,3) : c.replace(/\s/g,"").slice(0,3)).toUpperCase(); };
const ovr = p => Math.round(p.rating * 10);
const tierOf = p => ovr(p) >= 85 ? "tier-gold" : ovr(p) >= 75 ? "tier-green" : "tier-silver";

/* preenche qualquer carta (a principal ou as do painel de comparação) */
function holoContent(p, card = $("#holo-card")){
  card.className = `holo-card ${tierOf(p)} club-${slug(p.club)}`;
  card.setAttribute("aria-label", `Carta de ${p.name}: OVR ${ovr(p)}`);
  const s = [["GOL",p.g],["CHU",Math.round(p.shAcc)+"%"],["DES",p.tk],["COR",p.cl],["PAS",Math.round(p.pAcc)+"%"],["ASS",p.a]];
  card.querySelector(".holo-inner").innerHTML = `
    <div class="holo-top">
      <div class="holo-ovr"><b class="num">${ovr(p)}</b><span>${POS_ABBR[p.pos]}</span><i>${FLAGS[p.nat] || ""}</i></div>
      ${crest(p.club, "md")}
    </div>
    <div class="holo-portrait"><div class="holo-glow"></div>${photoKey(p)
      ? `${avatar(p,"md")}<img class="holo-photo" src="${asset(`jogadores/card_${photoKey(p)}.png`)}" alt="">`
      : avatar(p,"md")}</div>
    <div class="holo-name"><b>${p.name}</b><span>${p.club} · ${POS_LABEL[p.pos]}</span></div>
    <div class="holo-stats">${s.map(([k,v]) => `<div class="holo-stat"><b>${v}</b><span>${k}</span></div>`).join("")}</div>`;
}

const hround = (v, p = 3) => parseFloat(v.toFixed(p));
const hclamp = (v, min = 0, max = 100) => Math.min(Math.max(v, min), max);
const hadjust = (v, a, b, c, d) => hround(c + (d - c) * (v - a) / (b - a));
function makeSpring(initial, settings, onFrame){
  const keys = Object.keys(initial), value = {...initial}, target = {...initial}, vel = {};
  keys.forEach(k => vel[k] = 0);
  let cfg = {...settings}, raf = null;
  function frame(){
    let moving = false;
    for(const k of keys){
      const delta = target[k] - value[k];
      vel[k] += cfg.stiffness * delta - cfg.damping * vel[k];
      value[k] += vel[k];
      if(Math.abs(delta) > .01 || Math.abs(vel[k]) > .01) moving = true;
    }
    onFrame(value);
    raf = moving ? requestAnimationFrame(frame) : null;
  }
  return { set(next, nextCfg){ if(nextCfg) cfg = {...nextCfg}; Object.assign(target, next); if(raf === null) raf = requestAnimationFrame(frame); } };
}
const SPRING_INTERACT = {stiffness:.066, damping:.25}, SPRING_SNAP = {stiffness:.01, damping:.06}, SNAP_DELAY = 500;
function holoCard(card){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const float = card.closest(".holo-float");
  let snapTimer = null;
  const spring = makeSpring({rx:0, ry:0, gx:50, gy:50, o:0, bx:50, by:50}, SPRING_INTERACT, v => {
    const fc = hclamp(Math.sqrt((v.gy-50)**2 + (v.gx-50)**2) / 50, 0, 1);
    const set = (k, val) => card.style.setProperty(k, val);
    set("--pointer-x", `${hround(v.gx)}%`); set("--pointer-y", `${hround(v.gy)}%`);
    set("--pointer-from-center", hround(fc)); set("--card-opacity", hclamp(hround(v.o), 0, 1));
    set("--rotate-x", `${hround(v.rx)}deg`); set("--rotate-y", `${hround(v.ry)}deg`);
    set("--background-x", `${hround(v.bx)}%`); set("--background-y", `${hround(v.by)}%`);
  });
  function interact(e){
    clearTimeout(snapTimer); float.classList.add("interacting");
    const pt = e.touches ? e.touches[0] : e, r = card.getBoundingClientRect();
    const x = hclamp(hround(100/r.width*(pt.clientX - r.left))), y = hclamp(hround(100/r.height*(pt.clientY - r.top)));
    spring.set({rx:hround(-(x-50)/3.5), ry:hround((y-50)/3.5), gx:x, gy:y, o:1, bx:hadjust(x,0,100,37,63), by:hadjust(y,0,100,33,67)}, SPRING_INTERACT);
  }
  function interactEnd(){
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { float.classList.remove("interacting"); spring.set({rx:0, ry:0, gx:50, gy:50, o:0, bx:50, by:50}, SPRING_SNAP); }, SNAP_DELAY);
  }
  card.addEventListener("pointermove", interact);
  card.addEventListener("pointerleave", interactEnd);
  card.addEventListener("touchmove", interact, {passive:true});
  card.addEventListener("touchend", interactEnd);
  card.addEventListener("touchcancel", interactEnd);
}

/* vertical swap estritamente sequencial: a carta atual desce até sair da tela,
   o conteúdo é trocado fora da vista, e só então a nova sobe — sem fade nem sobreposição */
let holoShown = null, holoBusy = false, holoNext = null;
async function swapHolo(p){
  holoNext = p;
  if(holoBusy) return;
  holoBusy = true;
  const slot = $("#holo-slot"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  while(holoNext){
    const next = holoNext; holoNext = null;
    if(next.id === holoShown) continue;
    if(holoShown === null || still){ holoContent(next); holoShown = next.id; continue; }
    const dist = Math.ceil(innerHeight - slot.getBoundingClientRect().top + 40);
    const down = slot.animate([{transform:"translateY(0)"},{transform:`translateY(${dist}px)`}], {duration:420, easing:"cubic-bezier(.55,0,.85,.25)", fill:"forwards"});
    await down.finished;
    holoContent(next); holoShown = next.id;
    const up = slot.animate([{transform:`translateY(${dist}px)`},{transform:"translateY(0)"}], {duration:560, easing:"cubic-bezier(.16,.84,.3,1)", fill:"forwards"});
    down.cancel();
    await up.finished;
    up.cancel();
  }
  holoBusy = false;
}

/* ========== COMPARAÇÃO ENTRE JOGADORES ========== */
/* fluxo: botão "Comparar" → modo de escolha no ranking → clique em outro jogador abre o painel.
   O mesmo botão cancela a escolha ou encerra a comparação (os cards do dash voltam). */
const cmp = { mode: "off", b: null };           /* off | picking | on */
const CMP_ROWS = [
  ["rating","Rating geral"],["apps","Jogos"],["g","Gols"],["a","Assistências"],["tk","Desarmes"],["cl","Cortes"],
  ["sh","Chutes totais"],["sot","Chutes no alvo"],["shAcc","Precisão de chute"],
  ["pt","Passes totais"],["pc","Passes certos"],["pAcc","Precisão de passe"]
];
const cmpFmt = (k, v) => k === "rating" ? fmt(v) : (k === "shAcc" || k === "pAcc") ? `${fmt(v)}%` : int(v);

function compareRadar(a, b){
  const W = 420, H = 300, cx = 210, cy = 152, R = 98, n = RADAR_AXES.length;
  const ang = i => (-90 + i*360/n) * Math.PI/180;
  const pt = (i, r) => [cx + r*Math.cos(ang(i)), cy + r*Math.sin(ang(i))];
  const poly = r => RADAR_AXES.map((_,i) => pt(i,r).map(v => v.toFixed(1)).join(",")).join(" ");
  const shape = p => RADAR_AXES.map(([,k],i) => pt(i, R*Math.min(1, p[k]/STAT_MAX[k])));
  const pts = s => s.map(d => d.map(v => v.toFixed(1)).join(",")).join(" ");
  const sa = shape(a), sb = shape(b);
  const labels = RADAR_AXES.map(([l,k],i) => {
    const [x,y] = pt(i, R+18), c = Math.cos(ang(i)), s = Math.sin(ang(i));
    const anchor = c > .3 ? "start" : c < -.3 ? "end" : "middle";
    const y0 = s < -.9 ? y - 16 : s > .9 ? y + 4 : y - 4;
    const wa = a[k] > b[k], wb = b[k] > a[k];
    return `<text class="radar-label" x="${x.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}">${l}</text>
      <text class="radar-value" x="${x.toFixed(1)}" y="${(y0+15).toFixed(1)}" text-anchor="${anchor}"><tspan class="cmp-t-a${wa?" win":""}">${int(a[k])}</tspan><tspan class="cmp-t-sep"> · </tspan><tspan class="cmp-t-b${wb?" win":""}">${int(b[k])}</tspan></text>`;
  }).join("");
  return `<svg class="cmp-radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Radares sobrepostos de ${a.name} e ${b.name}">
    ${[.25,.5,.75,1].map(f => `<polygon class="radar-ring${f===1?" outer":""}" points="${poly(R*f)}"/>`).join("")}
    ${RADAR_AXES.map((_,i) => { const [x,y] = pt(i,R); return `<line class="radar-spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join("")}
    <polygon class="cmp-area-a" points="${pts(sa)}"/>
    <polygon class="cmp-area-b" points="${pts(sb)}"/>
    ${sa.map(([x,y]) => `<circle class="cmp-dot-a" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`).join("")}
    ${sb.map(([x,y]) => `<circle class="cmp-dot-b" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`).join("")}
    ${labels}
  </svg>`;
}

/* barra de duelo espelhada: A cresce para a esquerda a partir do centro, B para a direita */
const duel = (va, vb) => { const m = Math.max(va, vb) || 1, wa = va/m*100, wb = vb/m*100;
  return `<svg class="duel" viewBox="0 0 200 6" preserveAspectRatio="none" aria-hidden="true"><rect class="duel-track" width="200" height="6"/><rect class="duel-a" x="${(100-wa).toFixed(1)}" width="${wa.toFixed(1)}" height="6"/><rect class="duel-b" x="100" width="${wb.toFixed(1)}" height="6"/></svg>`; };

function renderCompare(){
  const a = BY_ID[state.selected], b = BY_ID[cmp.b];
  let winsA = 0, winsB = 0;
  const rows = CMP_ROWS.map(([k,l]) => {
    const va = a[k], vb = b[k], wa = va > vb, wb = vb > va;
    winsA += wa; winsB += wb;
    return `<div class="cmp-row">
      <span class="cmp-val cmp-val-a num${wa?" win":""}">${wa ? '<i class="cmp-up" aria-label="maior">▲</i>' : ""}${cmpFmt(k,va)}</span>
      <div class="cmp-mid"><span class="label">${l}</span>${duel(va, vb)}</div>
      <span class="cmp-val cmp-val-b num${wb?" win":""}">${cmpFmt(k,vb)}${wb ? '<i class="cmp-up" aria-label="maior">▲</i>' : ""}</span>
    </div>`;
  }).join("");
  $("#cmp-panel").innerHTML = `
    <div class="cmp-head">
      <div class="cmp-who cmp-who-a">${avatar(a,"sm")}<div><b>${a.name}</b><span>${a.club}</span></div></div>
      <span class="cmp-vs">VS</span>
      <div class="cmp-who cmp-who-b"><div><b>${b.name}</b><span>${b.club}</span></div>${avatar(b,"sm")}</div>
    </div>
    <div class="cmp-score">
      <span class="cmp-score-a num">${winsA}</span>
      <span class="label">métricas vencidas</span>
      <span class="cmp-score-b num">${winsB}</span>
    </div>
    ${compareRadar(a, b)}
    <span class="radar-note">Radares sobrepostos · escala: maior valor da liga em cada atributo</span>
    <div class="cmp-list">${rows}</div>`;
}

function setCompareMode(mode){
  cmp.mode = mode;
  const app = document.body;
  app.classList.toggle("is-picking", mode === "picking");
  app.classList.toggle("is-comparing", mode === "on");
  const btn = $("#compare-btn");
  btn.setAttribute("aria-pressed", mode !== "off");
  $("#compare-btn-label").textContent = mode === "off" ? "Comparar" : mode === "picking" ? "Cancelar" : "Encerrar comparação";
  $("#pick-hint").hidden = mode !== "picking";
  if(mode === "picking") $("#pick-name").textContent = BY_ID[state.selected].name;
  $("#compare").setAttribute("aria-hidden", mode !== "on");
}

async function openCompare(idB){
  cmp.b = idB;
  holoContent(BY_ID[state.selected], $("#cmp-card-a"));
  holoContent(BY_ID[idB], $("#cmp-card-b"));
  renderCompare();
  $("#cmp-panel").scrollTop = 0;
  setCompareMode("on");   /* entradas/saídas em slide ficam no CSS (.is-comparing) */
}

function toggleCompare(){
  if(cmp.mode === "off") setCompareMode("picking");
  else { setCompareMode("off"); cmp.b = null; }
}

/* ========== ORQUESTRAÇÃO E EVENTOS ========== */
function select(id){
  state.selected = id;
  const p = BY_ID[id];
  renderBio(p); renderPerf(p); renderHeatmap(p); renderPenalties(p); swapHolo(p);
  markActive(); markMetric();
}

document.addEventListener("click", e => {
  /* menu de clubes: clique fora fecha; clique dentro é tratado pelo próprio menu */
  if(!$("#club-menu").hidden && !e.target.closest("#club-menu, #club-btn")) toggleClubMenu(false);
  const metric = e.target.closest("[data-metric]");
  if(metric){ setMetric(metric.dataset.metric); return; }
  const posBtn = e.target.closest("[data-pos-filter]");
  if(posBtn){
    const g = posBtn.dataset.posFilter;
    state.pos.has(g) ? state.pos.delete(g) : state.pos.add(g);
    applyFilters(); return;
  }
  if(e.target.closest("#club-btn")){ toggleClubMenu(); return; }
  if(e.target.closest("#club-clear")){ state.clubs.clear(); applyFilters(); return; }
  if(e.target.closest("#filter-clear")){ state.pos.clear(); state.clubs.clear(); applyFilters(); return; }
  if(e.target.closest("#compare-btn")){ toggleCompare(); return; }
  const b = e.target.closest("[data-id]");
  if(b){
    const id = +b.dataset.id;
    if(cmp.mode === "picking"){ if(id !== state.selected) openCompare(id); return; }   /* o próprio jogador não conta */
    select(id);
  }
});
/* teclado: Enter/Espaço nas métricas (são role=button) e Esc fecha o menu */
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("#club-menu").hidden){ toggleClubMenu(false); $("#club-btn").focus(); }
  else if(e.key === "Escape" && cmp.mode !== "off"){ toggleCompare(); $("#compare-btn").focus(); }
  const metric = e.target.closest?.("[data-metric]");
  if(metric && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); setMetric(metric.dataset.metric); }
});
$("#club-list").addEventListener("change", e => {
  const i = e.target.closest("input[type=checkbox]");
  if(!i) return;
  i.checked ? state.clubs.add(i.value) : state.clubs.delete(i.value);
  applyFilters();
});
addEventListener("resize", () => { if(!$("#club-menu").hidden) placeClubMenu(); });
$("#search").addEventListener("input", e => {
  state.query = e.target.value;
  renderRanking();
});

holoCard($("#holo-card"));
holoCard($("#cmp-card-a"));
holoCard($("#cmp-card-b"));
buildClubMenu();
renderFilters();
renderRanking();
select(state.selected);
</script>
